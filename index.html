<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOUR FAVOURITE POKÉMON</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

:root { --px: 'Press Start 2P', monospace; }

/* Decorative glyphs (★ ▶ ◀ ⌂ ↻ ↶ …) are not in Press Start 2P, so the browser
   substitutes a fallback font with different vertical metrics, leaving them
   misaligned next to the pixel text. normalizeIcons() wraps them in .ico and
   this rule re-centres them on the text line. */
.ico {
  display:inline-block;
  font-size:0.9em;
  line-height:1;
  vertical-align:baseline;
  position:relative;
  top:-0.15em;
}

.gen1 {
  --bg0:#0a0f0a; --bg1:#0f1f0f; --bg2:#1a3a1a; --bg3:#306230;
  --fg4:#56a856; --fg5:#8bac0f; --fg6:#9bbc0f; --accent:#c8ff00;
  --border:#1a3a1a; --scanline:rgba(0,0,0,0.09);
}
.gen2 {
  --bg0:#0d0b1a; --bg1:#13112a; --bg2:#1e1b3a; --bg3:#3a2d6e;
  --fg4:#8979e0; --fg5:#c8a800; --fg6:#e8c800; --accent:#ffe040;
  --border:#1e1b3a; --scanline:rgba(100,80,200,0.06);
}
/* CHALLENGES theme — neutral blue/gold, distinct from gens */
.challenges {
  --bg0:#08101a; --bg1:#0c1830; --bg2:#15264a; --bg3:#2a4070;
  --fg4:#7089ba; --fg5:#c89030; --fg6:#e0b860; --accent:#ffd060;
  --border:#15264a; --scanline:rgba(80,120,200,0.05);
}
body.challenges::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
  background:
    radial-gradient(ellipse 70% 50% at 30% 30%, rgba(80,120,255,0.05) 0%, transparent 70%),
    radial-gradient(ellipse 50% 70% at 80% 80%, rgba(255,200,80,0.04) 0%, transparent 60%);
}

/* TOP NAV — primary section switcher */
.top-nav {
  background:var(--bg0); border-bottom:1px solid var(--border);
  padding:0 16px; display:flex; gap:0;
}
.top-nav-tab {
  flex:1; background:transparent; border:none; color:var(--fg4);
  font-family:var(--px); font-size:8px; padding:14px 0; cursor:pointer;
  letter-spacing:2px; text-align:center;
  border-bottom:2px solid transparent;
  -webkit-appearance:none; border-radius:0;
}
.top-nav-tab.active { color:var(--accent); border-bottom-color:var(--accent); }

/* CHALLENGES PAGE */
.challenges-wrap { flex:1; padding:24px 16px; }
.challenges-title { font-size:11px; color:var(--accent); letter-spacing:2px; line-height:2; margin-bottom:6px; }
.challenges-sub { font-size:8px; color:var(--fg4); line-height:2.2; margin-bottom:24px; }
.challenges-grid { display:flex; flex-direction:column; gap:14px; }
.challenge-card {
  background:var(--bg1); border:1px solid var(--border); padding:18px 16px;
  display:flex; flex-direction:column; gap:8px; cursor:pointer;
  position:relative; -webkit-appearance:none; border-radius:0;
  font-family:var(--px); color:var(--fg6); text-align:left;
  transition:background 0.1s, border-color 0.1s;
  min-height:140px; justify-content:space-between;
}
.challenge-card-body { display:flex; flex-direction:column; gap:8px; }
.challenge-card-footer { margin-top:14px; }
.challenge-card:active { background:var(--bg2); border-color:var(--fg5); }
.challenge-card.disabled { opacity:0.4; cursor:not-allowed; pointer-events:none; }
.challenge-card-eyebrow { font-size:7px; color:var(--fg4); letter-spacing:2px; }
.challenge-card-title { font-size:11px; color:var(--accent); letter-spacing:1px; line-height:1.6; }
.challenge-card-desc { font-size:8px; color:var(--fg4); line-height:2; margin-top:6px; }
@media (min-width:700px){
  .challenge-card-eyebrow { font-size:8px; }
  .challenge-card-title { font-size:12px; }
  .challenge-card-desc { font-size:8px; }
  }
.challenge-badge {
  position:absolute; top:14px; right:14px; font-size:7px; color:var(--bg3);
  border:1px solid var(--bg3); padding:3px 7px; letter-spacing:2px;
}
.challenge-badge.new { color:var(--accent); border-color:var(--accent); }
.challenge-badge.mega-badge {
  background:linear-gradient(135deg, #ffd060, #ff8030);
  color:#1a0f00; border:none; font-weight:bold;
  font-size:7px; padding:5px 10px;
  box-shadow:0 0 8px rgba(255,200,80,0.4);
}
.challenge-card.mega {
  background:linear-gradient(135deg, rgba(255,208,96,0.08), rgba(255,128,48,0.08));
  border:2px solid #ffd060;
}
.challenge-card.mega .challenge-card-title { color:#ffd060; font-size:12px; }
.challenge-card.mega .challenge-card-eyebrow { color:#e0b860; }
@media (min-width:700px){
  .challenge-card.mega { grid-column: 1 / -1; }
  .challenge-card.mega .challenge-card-title { font-size:16px; }
}

/* gen badge under sprite in challenge battle */
.poke-gen-badge {
  font-size:7px; color:var(--fg4); border:1px solid var(--bg3);
  padding:3px 8px; letter-spacing:2px; margin-top:4px;
}

/* GEN 3 — Game Boy Advance: deep red/crimson */
.gen3 {
  --bg0:#0f0a08; --bg1:#1f1008; --bg2:#3a1a08; --bg3:#7a2a08;
  --fg4:#d4673a; --fg5:#e87828; --fg6:#f09038; --accent:#ff4800;
  --border:#3a1a08; --scanline:rgba(200,80,0,0.07);
}
body.gen3::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
  background:
    radial-gradient(ellipse 70% 50% at 30% 30%, rgba(200,60,0,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 50% 70% at 80% 80%, rgba(255,80,0,0.04) 0%, transparent 60%);
}

/* GEN 4 — Nintendo DS Diamond/Pearl: glacial steel-blue */
.gen4 {
  --bg0:#080c12; --bg1:#0e1422; --bg2:#1a2540; --bg3:#3a4d75;
  --fg4:#7593c2; --fg5:#8ca8d4; --fg6:#c0d4ec; --accent:#7cc8ff;
  --border:#1a2540; --scanline:rgba(120,180,240,0.06);
}
.gen5 {
  --bg0:#06070a; --bg1:#0e0f14; --bg2:#1d1f28; --bg3:#4a4e58;
  --fg4:#969ca6; --fg5:#a8aeb8; --fg6:#e8e8ec; --accent:#ff5050;
  --border:#1d1f28; --scanline:rgba(255,255,255,0.04);
}
body.gen4::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
  background:
    radial-gradient(ellipse 70% 50% at 30% 30%, rgba(120,180,255,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 50% 70% at 80% 80%, rgba(180,200,230,0.04) 0%, transparent 60%);
}
body.gen5::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
  background:
    radial-gradient(ellipse 70% 50% at 30% 30%, rgba(120,180,255,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 50% 70% at 80% 80%, rgba(180,200,230,0.04) 0%, transparent 60%);
}

html, body {
  min-height:100vh; min-height:100svh; min-height:100dvh;
  background:var(--bg0); color:var(--fg6);
  font-family:var(--px); overflow-x:hidden;
  transition:background 0.3s, color 0.3s;
  -webkit-text-size-adjust:100%;
}
/* When in battle screen — lock viewport, no page scroll.
   Use flex fill so .main takes exactly the space left under the header,
   regardless of header height across breakpoints (no magic px number). */
body.battle-active {
  height:100vh; height:100svh; height:100dvh;
  min-height:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
body.battle-active .main {
  flex:1 1 auto;
  height:auto;
  min-height:0;
  overflow:hidden;
}

body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:1000;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,var(--scanline) 3px,var(--scanline) 4px);
}
body.gen2::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
  background:
    radial-gradient(ellipse 80% 60% at 20% 40%, rgba(100,60,200,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 60% 80% at 80% 70%, rgba(200,168,0,0.05) 0%, transparent 60%);
}

@keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

/* ── GEN SWITCHER ── */
.gen-switcher {
  background:var(--bg1); border-bottom:1px solid var(--border);
  padding:10px 16px; display:flex; align-items:center; gap:8px;
}
.gen-switcher-label { display:none; }
.gen-tab {
  flex:1; background:transparent; border:1px solid var(--bg3); color:var(--fg4);
  font-family:var(--px); font-size:8px; padding:10px 0; cursor:pointer;
  letter-spacing:1px; text-align:center; transition:all 0.15s; line-height:1.5;
}
.gen-tab.active { background:var(--bg3); border-color:var(--accent); color:var(--accent); }

/* ── SITE HEADER ── */
.site-header {
  border-bottom:1px solid var(--border); padding:12px 16px;
  display:flex; align-items:center; justify-content:space-between;
  background:var(--bg1); position:sticky; top:0; z-index:100;
  gap:16px;
}
.logo { font-size:8px; color:var(--accent); letter-spacing:1px; line-height:1.6;
  white-space:nowrap; flex-shrink:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.logo span { display:none; font-size:8px; color:var(--fg4); letter-spacing:1px; }
.header-right { display:flex; align-items:center; gap:12px; flex-shrink:0; position:relative; }

/* user trigger button */
.user-trigger {
  display:flex; align-items:center; gap:8px;
  background:transparent; border:1px solid var(--bg3); color:var(--fg5);
  font-family:var(--px); font-size:8px; padding:7px 10px; cursor:pointer;
  letter-spacing:1px; -webkit-appearance:none; border-radius:0;
}
.user-trigger:active, .user-trigger.open { border-color:var(--accent); color:var(--accent); }
.user-trigger-name { max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.user-trigger-caret { font-size:7px; color:var(--fg4); transition:transform 0.15s; }
.user-trigger.open .user-trigger-caret { transform:rotate(180deg); color:var(--accent); }

/* dropdown menu */
.user-menu {
  position:absolute; top:calc(100% + 6px); right:0; min-width:220px;
  background:var(--bg1); border:1px solid var(--border);
  z-index:200; padding:0;
  box-shadow:0 4px 0 rgba(0,0,0,0.4);
}
.user-menu-status {
  padding:14px 16px; border-bottom:1px solid var(--border);
  display:flex; flex-direction:column; gap:8px;
}
.user-menu-label { font-size:7px; color:var(--fg4); letter-spacing:2px; }
.user-menu-name { font-size:9px; color:var(--accent); letter-spacing:1px;
  word-break:break-all; line-height:1.5; }
.user-menu-meta { font-size:7px; color:var(--bg3); letter-spacing:1px; line-height:1.6; }
.user-menu-action {
  display:block; width:100%; text-align:left;
  background:transparent; border:none; border-bottom:1px solid var(--border);
  color:var(--fg5); font-family:var(--px); font-size:8px; padding:14px 16px;
  cursor:pointer; letter-spacing:1px;
  -webkit-appearance:none; border-radius:0;
}
.user-menu-action:last-child { border-bottom:none; }
.user-menu-action:active { background:var(--bg2); color:var(--accent); }
.user-menu-action.danger:active { color:#ff5050; }
.user-menu-action .menu-action-sub {
  display:block; font-size:7px; color:var(--bg3); letter-spacing:1px; margin-top:5px;
}

/* backdrop for closing */
.user-menu-backdrop {
  position:fixed; inset:0; z-index:150; background:transparent;
}

/* confirm dialog */
.confirm-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.confirm-box {
  background:var(--bg1); border:1px solid var(--accent);
  max-width:340px; width:100%; padding:24px 20px;
  display:flex; flex-direction:column; gap:20px;
}
.confirm-title { font-size:10px; color:var(--accent); letter-spacing:2px; line-height:1.6; }
.confirm-msg { font-size:8px; color:var(--fg5); line-height:2; letter-spacing:1px; }
.confirm-actions { display:flex; gap:14px; margin-top:10px; }
.confirm-btn {
  flex:1; background:transparent; border:1px solid var(--bg3); color:var(--fg5);
  font-family:var(--px); font-size:8px; padding:12px 10px; cursor:pointer;
  letter-spacing:1px; -webkit-appearance:none; border-radius:0;
}
.confirm-btn.primary { border-color:var(--accent); color:var(--accent); }
.confirm-btn:active { background:var(--bg2); }

/* ── LEGAL PAGES ── */
.legal-wrap {
  flex:1; display:flex; flex-direction:column; align-items:center;
  padding:32px 20px 80px;
  overflow-y:auto;
}
.legal-box {
  width:100%; max-width:720px;
  background:var(--bg1); border:1px solid var(--border);
  padding:28px 22px;
}
.legal-back {
  background:transparent; border:none; color:var(--fg4);
  font-family:var(--px); font-size:8px; padding:0; cursor:pointer;
  margin-bottom:18px; letter-spacing:1px;
}
.legal-title {
  font-size:12px; color:var(--accent); letter-spacing:2px;
  line-height:1.6; margin-bottom:10px;
}
.legal-sub {
  font-size:8px; color:var(--fg4); letter-spacing:2px;
  margin-bottom:24px;
}
.legal-h2 {
  font-size:10px; color:var(--accent); letter-spacing:2px;
  margin-top:24px; margin-bottom:14px;
  padding-top:18px; border-top:1px solid var(--border);
}
.legal-h2:first-of-type { padding-top:0; border-top:none; margin-top:0; }
.legal-p {
  font-size:8px; color:var(--fg5); line-height:2.2;
  margin-bottom:18px; letter-spacing:0.5px;
}
.legal-p strong { color:var(--fg6); }
.legal-p a { color:var(--accent); text-decoration:underline; }
.legal-list {
  font-size:8px; color:var(--fg5); line-height:2.2;
  margin-bottom:18px; padding-left:18px; letter-spacing:0.5px;
}
.legal-list li { margin-bottom:6px; }
.legal-meta {
  font-size:7px; color:var(--bg3); letter-spacing:2px;
  margin-top:32px; padding-top:16px; border-top:1px solid var(--border);
}
@media (min-width:700px){
  .legal-wrap { padding:48px 32px 96px; }
  .legal-box { padding:48px 56px; }
  .legal-title { font-size:20px; margin-bottom:18px; }
  .legal-sub { font-size:8px; margin-bottom:32px; }
  .legal-h2 { font-size:14px; margin-top:32px; padding-top:24px; }
  .legal-p, .legal-list { font-size:10px; line-height:2; }
  .legal-meta { font-size:8px; }
}

/* ── TERMS CHECKBOX (register form) ── */
.terms-row {
  display:flex; align-items:flex-start; gap:14px;
  padding:14px 0; margin-bottom:16px;
  font-size:8px; color:var(--fg4); line-height:1.8; letter-spacing:0.5px;
}
.terms-row input[type="checkbox"] {
  flex-shrink:0; width:16px; height:16px;
  margin-top:1px; cursor:pointer;
  accent-color:var(--accent);
}
.terms-row label { cursor:pointer; }
.terms-row a, .terms-link { color:var(--accent); text-decoration:underline; cursor:pointer; }

/* ── LANDING LEGAL FOOTER ── */
.landing-legal {
  padding:24px 20px 32px;
  display:flex; flex-direction:column; gap:14px;
  align-items:center; text-align:center;
  border-top:1px solid var(--border);
}
.landing-legal-links {
  display:flex; gap:22px; flex-wrap:wrap; justify-content:center;
}
.landing-legal-link {
  font-size:8px; color:var(--fg4); letter-spacing:2px;
  cursor:pointer; padding:4px 0;
  background:none; border:none; font-family:var(--px);
}
.landing-legal-link:active, .landing-legal-link:hover { color:var(--accent); }
.landing-legal-disclaimer {
  font-size:7px; color:var(--bg3); line-height:1.8;
  letter-spacing:1px; max-width:480px; margin-top:10px;
}
@media (min-width:700px){
  .landing-legal-link { font-size:8px; }
  .landing-legal-disclaimer { font-size:8px; }
}

/* ── ACCOUNT SETTINGS PAGE ── */
.account-section {
  border-top:1px solid var(--border);
  padding:18px 0; margin-top:18px;
}
.account-section:first-child { border-top:none; padding-top:0; margin-top:0; }
.account-h3 {
  font-size:9px; color:var(--accent); letter-spacing:2px;
  margin-bottom:16px;
}
.account-row {
  display:flex; flex-direction:column; gap:8px;
  padding:10px 0; font-size:8px; color:var(--fg5);
}
.account-row-label { font-size:7px; color:var(--bg3); letter-spacing:2px; }
.account-row-value { color:var(--fg6); word-break:break-all; }
.btn-danger {
  background:transparent; border:1px solid #6b2020; color:#c05050;
  font-family:var(--px); font-size:8px; padding:12px 16px; cursor:pointer;
  letter-spacing:1px; -webkit-appearance:none; border-radius:0;
  margin-top:10px;
}
.btn-danger:active { background:#6b2020; color:var(--fg6); }
@media (min-width:700px){
  .account-h3 { font-size:11px; }
  .account-row { font-size:9px; }
  .account-row-label { font-size:8px; }
  .btn-danger { font-size:9px; }
  .btn-danger:hover { background:#6b2020; color:var(--fg6); }
}

@media (max-width: 520px) {
  .site-header { padding:10px 12px; gap:12px; }
  .header-right { gap:6px; }
  .user-trigger { font-size:7px; padding:6px 8px; }
  .user-trigger-name { max-width:60px; }
  .user-menu { min-width:200px; right:-8px; }
  .user-menu-name { font-size:8px; }
  .user-menu-action { font-size:8px; padding:12px 14px; }
}
.nav-btn {
  background:transparent; border:none; color:var(--fg4); font-family:var(--px);
  font-size:7px; padding:10px 12px; cursor:pointer; letter-spacing:1px;
  border-bottom:2px solid transparent;
}
.nav-btn.active { color:var(--accent); border-bottom-color:var(--accent); }
.btn-sm {
  background:transparent; border:1px solid var(--bg3); color:var(--fg5);
  font-family:var(--px); font-size:7px; padding:10px 12px; cursor:pointer; letter-spacing:1px;
}

/* ── MAIN ── */
.main { min-height:calc(100svh - 95px); min-height:calc(100dvh - 95px); display:flex; flex-direction:column; }

/* LOADING */
.loading-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; font-size:8px; color:var(--fg4); letter-spacing:2px; }
.pixel-cursor { width:10px; height:16px; background:var(--accent); animation:blink 0.7s infinite; }

/* ── AUTH ── */
.auth-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
.auth-box { width:100%; max-width:340px; margin:0 auto; border:1px solid var(--border); background:var(--bg1); padding:24px 18px; }
.auth-title { font-size:10px; color:var(--accent); margin-bottom:10px; letter-spacing:2px; line-height:1.7; }
.auth-sub { font-size:8px; color:var(--fg4); margin-bottom:22px; line-height:1.8; }
.field-label { font-size:8px; color:var(--fg4); margin-bottom:10px; display:block; letter-spacing:1px; }
.field-input {
  width:100%; background:var(--bg0); border:1px solid var(--bg3); color:var(--fg6);
  font-family:var(--px); font-size:18px; line-height:1.35; padding:10px 12px; outline:none; margin-bottom:16px;
  -webkit-appearance:none; border-radius:0;
}
.field-input::placeholder { font-size:14px; }
.field-input:focus { border-color:var(--accent); }
.field-input::placeholder { color:var(--bg3); }
/* Prevent iOS Safari auto-zoom on form fields */
input, textarea, select { font-size:18px; }
.btn-primary {
  width:100%; background:var(--fg5); border:none; color:var(--bg0);
  font-family:var(--px); font-size:8px; padding:16px; cursor:pointer;
  letter-spacing:1px; margin-top:4px; -webkit-appearance:none; border-radius:0;
}
.btn-primary:active { background:var(--accent); }
.btn-primary.dark { background:var(--bg2); color:var(--fg5); }
.btn-primary.dark:active { background:var(--bg3); color:var(--accent); }
.auth-msg { font-size:8px; color:var(--fg4); min-height:18px; margin:10px 0; line-height:1.8; }
.auth-msg.error { color:#c05050; }
.auth-toggle { font-size:8px; color:var(--fg4); text-align:center; margin-top:18px; cursor:pointer; line-height:1.8; padding:14px; }
.guest-note { font-size:8px; color:var(--fg4); line-height:1.8; text-align:center; margin-top:18px; }
.guest-cta { margin-top:14px; }

/* ── MENU ── */
.menu-wrap { flex:1; display:flex; flex-direction:column; }
.menu-left { background:var(--bg1); padding:10px 16px 24px; border-bottom:1px solid var(--border); }

/* ══ REGION CARD — centered showcase style ══ */
.region-card {
  position:relative;
  /* pixel-dot texture layered over the per-gen gradient */
  background:
    radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px) 0 0 / 8px 8px,
    linear-gradient(180deg, var(--region-grad-1, var(--bg1)) 0%, var(--region-grad-2, var(--bg0)) 100%);
  border:1px solid var(--region-edge, var(--accent));
  border-left-width:3px;
  border-right-width:3px;
  padding:14px 16px 12px;
  margin-bottom:32px;
  overflow:hidden;
  display:flex; flex-direction:column; gap:8px;
  text-align:center;
  box-shadow: inset 0 0 18px -9px var(--region-edge, var(--accent));
}
/* Game Boy window corner brackets (per-gen colour) */
.region-card::before, .region-card::after {
  content:''; position:absolute; width:12px; height:12px;
  border:2px solid var(--region-edge, var(--accent)); opacity:0.5; pointer-events:none; z-index:2;
}
.region-card::before { top:8px; left:8px; border-right:none; border-bottom:none; }
.region-card::after { bottom:8px; right:8px; border-left:none; border-top:none; }

/* Header: name + tagline */
.region-card-header { position:relative; z-index:1; }
.region-card-name {
  font-size:14px; color:var(--region-edge, var(--accent));
  letter-spacing:2px; line-height:1.6;
  font-weight:bold;
}
.region-card-tagline {
  font-size:7px; color:var(--fg5);
  letter-spacing:4px; margin-top:3px;
}

/* Quote */
.region-card-quote {
  position:relative; z-index:1;
  padding:0 8px;
}
.region-quote-text {
  font-size:8px; color:var(--fg6);
  letter-spacing:1px; line-height:1.7;
  font-style:italic;
  max-width:300px; margin:0 auto;
}
.region-quote-by {
  font-size:7px; color:var(--region-edge, var(--accent));
  letter-spacing:3px; margin-top:4px;
  font-style:normal;
}

/* Divider — single dotted line */
.region-card-divider {
  height:1px;
  background-image:linear-gradient(to right, transparent 0%, var(--bg3) 40%, var(--bg3) 60%, transparent 100%);
  margin:0;
  position:relative; z-index:1;
}

/* Meta */
.region-card-meta {
  position:relative; z-index:1;
  display:flex; flex-direction:column; gap:5px;
}
.region-card-meta-line {
  font-size:7px; color:var(--fg5); letter-spacing:2px;
  line-height:1.6;
}
.region-card-meta-line.games {
  color:var(--region-edge, var(--accent));
  font-size:7px; letter-spacing:3px;
}

/* Starters — final evolutions in a row, aligned on a common baseline */
.region-card-starters {
  display:flex; justify-content:center; align-items:flex-end; gap:14px;
  margin-top:0;
  position:relative; z-index:1;
}
.region-starter-cell {
  display:flex; align-items:flex-end; justify-content:center;
  flex-shrink:0;
}
.region-starter-sprite {
  /* fixed render height = identical size for all three, regardless of each
     source sprite's native canvas dimensions */
  height:64px; width:auto;
  image-rendering:pixelated;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,0.5));
  display:block;
  transition:transform .15s, filter .15s;
}
.region-starter-cell:hover .region-starter-sprite {
  transform:translateY(-4px) scale(1.08);
  filter:drop-shadow(0 0 6px var(--region-edge, var(--accent)));
}
@media (hover:none){
  .region-starter-cell:hover .region-starter-sprite { transform:none; filter:drop-shadow(0 2px 0 rgba(0,0,0,0.5)); }
}
/* Optical size match: later-gen sprites fill more of their canvas, so they get
   a slightly smaller render height to read as the same size as Gen I/II. */
.region-card.gen3-card .region-starter-sprite { height:56px; }
.region-card.gen4-card .region-starter-sprite { height:54px; }
.region-card.gen5-card .region-starter-sprite { height:52px; }

/* Per-gen palette */
.region-card.gen1-card { --region-grad-1:#1a2a14; --region-grad-2:#0a1408; --region-edge:#9bbc0f; }
.region-card.gen2-card { --region-grad-1:#1f1530; --region-grad-2:#0e0820; --region-edge:#ffd060; }
.region-card.gen3-card { --region-grad-1:#2a0e15; --region-grad-2:#180608; --region-edge:#e85060; }
.region-card.gen4-card { --region-grad-1:#0e1f30; --region-grad-2:#070f1a; --region-edge:#7cc8ff; }
.region-card.gen5-card { --region-grad-1:#1a0e10; --region-grad-2:#080406; --region-edge:#ff5050; }

@media (min-width:700px){
  .region-card { padding:18px 22px 16px; margin-bottom:20px; gap:14px; }
  .region-card-name {
  font-size:14px; letter-spacing:3px; }
  .region-card-tagline {
  font-size:7px; letter-spacing:5px; }
  .region-quote-text { font-size:9px; max-width:420px; line-height:1.9; }
  .region-quote-by { font-size:8px; }
  .region-card-meta-line { font-size:8px; }
  .region-card-meta-line.games { font-size:8px; }
  .region-card-starters { gap:22px; margin-top:4px; }
  .region-starter-sprite { height:84px; }
  .region-card.gen3-card .region-starter-sprite { height:74px; }
  .region-card.gen4-card .region-starter-sprite { height:70px; }
  .region-card.gen5-card .region-starter-sprite { height:68px; }
}
.menu-hero { font-size:11px; color:var(--accent); line-height:1.6; margin-bottom:5px; letter-spacing:1px; }
.menu-sub { font-size:8px; color:var(--fg4); line-height:1.6; margin-bottom:18px; }

/* Menu claim — compact title between region card and mode selector */
.menu-claim {
  font-size:11px;
  color:var(--accent);
  letter-spacing:2px;
  line-height:1.5;
  text-align:center;
  margin:18px 0 8px;
  padding:0 4px;
}

/* ══ MODE MENU — Pokémon-style ══ */
.mode-menu-divider {
  display:flex; align-items:center; gap:14px;
  margin:18px 0 16px;
}
.mode-menu-divider-line {
  flex:1; height:1px; background:var(--bg3);
}
.mode-menu-divider-text {
  font-size:8px; color:var(--accent); letter-spacing:3px;
  white-space:nowrap;
}

.mode-btn {
  position:relative;
  display:flex; align-items:center; gap:16px;
  background:var(--bg0);
  border:2px solid var(--bg3);
  color:var(--fg6);
  font-family:var(--px);
  padding:14px 14px 14px 26px;
  cursor:pointer;
  width:100%;
  text-align:left;
  margin-bottom:16px;
  transition:all 0.15s;
  /* Inner border effect — like Pokémon UI window */
  box-shadow: inset 0 0 0 1px var(--bg1);
}

.mode-btn-cursor {
  position:absolute; left:8px; top:50%; transform:translateY(-50%);
  font-size:9px; color:var(--bg3);
  transition:color 0.15s;
}
.mode-btn-icon {
  font-size:16px; color:var(--accent);
  width:24px; text-align:center;
  flex-shrink:0;
}
.mode-btn-text {
  flex:1; min-width:0;
  display:flex; flex-direction:column; gap:10px;
}
.mode-btn-name {
  font-size:11px; color:var(--accent); letter-spacing:2px;
  font-weight:bold;
}
.mode-btn-sub {
  font-size:8px; color:var(--fg4); letter-spacing:2px;
  line-height:1.6;
}

.mode-btn:active {
  background:var(--bg1);
  border-color:var(--accent);
}
.mode-btn:active .mode-btn-cursor {
  color:var(--accent);
}

.mode-btn.community {
  border-color:var(--accent);
  box-shadow: inset 0 0 0 1px var(--bg1), 0 0 0 0 var(--accent);
}
.mode-btn.community .mode-btn-cursor { color:var(--accent); opacity:0.5; }


.menu-btn {
  display:block; width:100%; background:transparent; border:1px solid var(--bg3);
  color:var(--fg6); font-family:var(--px); font-size:8px; padding:16px 14px;
  cursor:pointer; text-align:left; letter-spacing:1px; margin-bottom:10px;
  position:relative; -webkit-appearance:none; border-radius:0;
}
.menu-btn::after { content:'▶'; position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--bg3); }
.menu-btn:active { background:var(--bg2); border-color:var(--fg5); color:var(--accent); }
.menu-btn small { display:block; font-size:8px; color:var(--fg4); margin-top:10px; letter-spacing:1px; }
.menu-pick-preview {
  display:flex; flex-direction:column; gap:3px; margin-top:14px;
  border-top:1px solid var(--bg2); padding-top:10px;
}
.preview-copy { display:flex; flex-direction:column; gap:6px; min-width:0; }
/* Pick preview — compact pill */
.preview-name {
  font-size:8px; color:var(--accent); letter-spacing:1px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.type-pick-preview, .challenge-pick-preview {
  display:flex; flex-direction:column; gap:3px;
  margin-top:0; max-width:100%;
  border-top:1px solid var(--bg2); padding-top:8px;
}
.type-pick-preview.empty, .challenge-pick-preview.empty { display:none; }
.preview-label {
  font-size:7px; color:var(--bg3); letter-spacing:2px;
}


/* Leaderboard card — compact tinted card */
.lb-card {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  width:100%;
  margin-top:24px;
  padding:14px 16px;
  background:var(--bg2);
  border:1px solid var(--fg5);
  cursor:pointer;
  box-sizing:border-box;
  text-align:left;
  font-family:var(--px);
  transition:background 0.15s;
}
.lb-card-body { display:flex; flex-direction:column; gap:5px; flex:1; min-width:0; }
.lb-card-eyebrow {
  font-size:7px;
  color:var(--accent);
  letter-spacing:3px;
}
.lb-card-title {
  font-size:9px;
  color:var(--fg6);
  letter-spacing:1px;
  line-height:1.6;
}
.lb-card-cta {
  font-size:12px;
  color:var(--accent);
  flex-shrink:0;
  line-height:1.6;
}
.lb-card:active {
  background:var(--fg5);
}
.lb-card:active .lb-card-eyebrow,
.lb-card:active .lb-card-title,
.lb-card:active .lb-card-cta {
  color:var(--bg0);
}
.menu-right { background:var(--bg0); padding:20px 16px; flex:1; }
.saved-title { font-size:8px; color:var(--bg3); letter-spacing:2px; margin-bottom:18px; border-bottom:1px solid var(--border); padding-bottom:12px; }
.saved-item { display:flex; align-items:center; gap:16px; padding:10px 0; border-bottom:1px solid var(--bg1); }
.saved-sprite { width:40px; height:40px; image-rendering:pixelated; flex-shrink:0; }
.saved-cat { font-size:8px; color:var(--bg3); margin-bottom:5px; letter-spacing:1px; }
.saved-name { font-size:9px; color:var(--accent); }
.saved-type { font-size:8px; color:var(--fg4); margin-top:4px; }
.no-saved { font-size:9px; color:var(--bg2); line-height:2.4; padding:24px 0; }

/* ── TYPE SELECT ── */
.typesel-wrap { flex:1; padding:20px 16px; }
.typesel-title { font-size:11px; color:var(--accent); margin-bottom:6px; letter-spacing:2px; }
.typesel-sub { font-size:8px; color:var(--fg4); margin-bottom:20px; line-height:2.2; }
.type-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.type-btn {
  background:var(--bg1); border:1px solid var(--border); color:var(--fg5);
  font-family:var(--px); font-size:8px; padding:14px 12px; cursor:pointer;
  text-align:left; -webkit-appearance:none; border-radius:0;
  display:flex; flex-direction:column; gap:8px;
  min-height:110px;
  justify-content:space-between;
}
.type-btn-head { display:flex; align-items:center; justify-content:space-between; gap:14px; }
.type-btn-meta { display:flex; flex-direction:column; gap:8px; flex:1; min-width:0; }
.type-btn small { display:block; font-size:8px; color:var(--bg3); letter-spacing:1px; }
.type-btn:active { background:var(--bg2); border-color:var(--fg4); color:var(--accent); }
.type-btn.inprog { border-color:var(--fg5); }
.type-btn.inprog small { color:var(--accent); }
.back-link {
  background:transparent; border:none; color:var(--bg3); font-family:var(--px);
  font-size:8px; cursor:pointer; padding:0; margin-bottom:20px;
  display:inline-block; letter-spacing:1px;
}

/* ── BATTLE ── */
.battle-wrap { flex:1 1 auto; display:flex; flex-direction:column; min-height:0; overflow:hidden; }

.battle-topbar {
  background:var(--bg1); border-bottom:1px solid var(--border);
  padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:14px;
}
.battle-topbar-center { flex:1; display:flex; flex-direction:column; align-items:center; gap:10px; }
.battle-mode-label { font-size:8px; color:var(--bg3); letter-spacing:2px; }
.battle-count { font-size:8px; color:var(--fg5); }
.battle-streak { font-size:8px; color:var(--fg4); min-width:60px; }
.battle-streak-r { text-align:right; }
.progress-track { width:100%; max-width:200px; height:3px; background:var(--bg2); }
.progress-fill { height:100%; background:var(--accent); transition:width 0.4s; }
.autosave-badge { font-size:7px; color:var(--bg3); letter-spacing:1px; opacity:0; transition:opacity 0.3s; }
.autosave-badge.show { opacity:1; }

/* BATTLE ARENA — stacked on mobile */
.battle-arena { flex:1; display:flex; flex-direction:column; min-height:0; min-width:0; }

/* ── BRACKET MODE ── */
.battle-body { flex:1; display:flex; flex-direction:column; min-height:0; }
.bracket-round-label {
  font-size:8px; color:var(--accent); letter-spacing:3px;
  text-align:center; padding:14px 16px 6px;
  border-bottom:1px solid var(--border);
}
.bracket-side {
  display:flex; flex-direction:column; gap:20px;
  padding:14px 12px; background:var(--bg1);
  border-bottom:1px solid var(--border);
  max-height:170px; overflow-y:auto;
  scrollbar-width:thin;
}
/* Scrollbar style for bracket-side */
.bracket-side::-webkit-scrollbar { width:6px; }
.bracket-side::-webkit-scrollbar-track { background:var(--bg0); }
.bracket-side::-webkit-scrollbar-thumb { background:var(--bg3); border-radius:0; }

.bracket-side-title { font-size:8px; color:var(--accent); letter-spacing:2px; line-height:1.6; }
.bracket-side-sub { font-size:7px; color:var(--fg4); letter-spacing:2px; margin-top:-12px; line-height:1.6; }
.bracket-side-group { display:flex; flex-direction:column; gap:8px; }
.bracket-side-group-label { font-size:7px; color:var(--bg3); letter-spacing:2px; }
.bracket-side-grid {
  display:flex; flex-wrap:wrap; gap:3px;
}
.bracket-side-cell {
  width:30px; height:30px; flex-shrink:0;
  background:var(--bg2); border:1px solid var(--bg3);
  display:flex; align-items:center; justify-content:center;
  position:relative;
}
.bracket-side-cell.advanced { border-color:var(--accent); }
.bracket-side-cell.waiting { opacity:0.5; }
.bracket-side-sprite {
  width:24px; height:24px; image-rendering:pixelated;
}
.bracket-side-empty { font-size:7px; color:var(--bg3); padding:4px 0; }

.pokemon-card {
  flex:1; display:flex; flex-direction:row; align-items:center; justify-content:center;
  gap:16px; padding:6px 12px; cursor:pointer; background:transparent; border:none;
  border-bottom:1px solid var(--border); transition:background 0.1s;
  -webkit-tap-highlight-color:transparent;
  position:relative;
}
.pokemon-card .poke-sprite { transition:opacity 0.18s; }
.pokemon-card .poke-info { transition:opacity 0.18s; }
.pokemon-card.is-loading .poke-sprite,
.pokemon-card.is-loading .poke-info { opacity:0; }
.pokemon-card:last-child { border-bottom:none; border-top:1px solid var(--border); }
.pokemon-card:active { background:var(--bg1); transform:scale(0.99); }
.pokemon-card:active .poke-name { color:var(--accent); }
/* ── SELECTION EFFECT ── localized: sprite pops, ring pulses, loser fades ── */
.pokemon-card.winner {
  background:var(--bg2); z-index:2;
}
.pokemon-card.winner .poke-sprite { animation:pickpop 0.32s ease-out; }
@keyframes pickpop {
  0%   { transform:scale(1); filter:brightness(1); }
  40%  { transform:scale(1.12) translateY(-3px); filter:brightness(1.5) drop-shadow(0 0 6px var(--accent)); }
  100% { transform:scale(1); filter:brightness(1); }
}
.pokemon-card.winner .poke-name { color:var(--accent); text-shadow:0 0 8px var(--accent); }
.pokemon-card.winner::after {
  content:''; position:absolute; inset:0; pointer-events:none; z-index:3;
  border:2px solid var(--accent);
  animation:pickring 0.45s ease-out forwards;
}
@keyframes pickring {
  0%   { opacity:0.85; transform:scale(0.96); }
  100% { opacity:0; transform:scale(1.04); }
}
.pokemon-card.loser {
  background:var(--bg0); pointer-events:none;
  animation:picklose 0.3s ease-out forwards;
}
@keyframes picklose {
  0%   { opacity:1; transform:scale(1); filter:none; }
  100% { opacity:0.18; transform:scale(0.93); filter:grayscale(0.8); }
}

.poke-sprite { width:125px; height:125px; image-rendering:pixelated; flex-shrink:0; }
.poke-info { display:flex; flex-direction:column; gap:10px; }
.poke-num { font-size:8px; color:var(--bg3); letter-spacing:2px; }
.poke-name { font-size:11px; color:var(--fg6); letter-spacing:1px; line-height:1.5; transition:color 0.1s; }
.poke-type { font-size:8px; color:var(--bg3); letter-spacing:1px; }

.vs-divider {
  display:flex; align-items:center; justify-content:center;
  background:var(--bg1); padding:8px 0;
  border-top:1px solid var(--border); border-bottom:1px solid var(--border);
}
.vs-text { font-size:10px; color:var(--bg2); letter-spacing:8px; writing-mode:horizontal-tb; }

.battle-footer {
  background:var(--bg1); border-top:1px solid var(--border);
  padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
  gap:14px;
}
.battle-footer-text { flex:1; text-align:center; font-size:8px; color:var(--fg4); letter-spacing:1px; line-height:1.8; }
.guest-battle-banner {
  background:var(--bg0); border-bottom:1px solid var(--border);
  color:var(--fg4); font-size:7px; line-height:2; letter-spacing:1px;
  padding:8px 14px; text-align:center;
}
.guest-battle-banner button {
  background:transparent; border:none; color:var(--accent); font-family:var(--px);
  font-size:7px; cursor:pointer; padding:0; letter-spacing:1px;
}
.battle-helper-text { display:block; font-size:7px; color:var(--bg3); margin-top:4px; letter-spacing:1px; }
/* keyboard hint only where there's a real keyboard (pointer + hover) */
.kbd-hint { display:none; color:var(--fg4); }
@media (hover:hover) and (pointer:fine){ .kbd-hint { display:block; } }
.battle-exit-btn {
  background:transparent; border:1px solid var(--bg3); color:var(--fg4);
  font-family:var(--px); font-size:8px; padding:8px 12px; cursor:pointer; letter-spacing:1px;
  white-space:nowrap; flex-shrink:0; -webkit-appearance:none; border-radius:0;
}
.battle-restart-btn {
  background:transparent; border:1px solid var(--bg3); color:var(--fg4);
  font-family:var(--px); font-size:8px; padding:8px 12px; cursor:pointer; letter-spacing:1px;
  white-space:nowrap; flex-shrink:0; -webkit-appearance:none; border-radius:0;
}
.battle-undo-floating {
  display:block; width:100%; background:var(--bg1); border:none; border-top:1px solid var(--border);
  color:var(--fg4); font-family:var(--px); font-size:8px; padding:12px 16px;
  cursor:pointer; letter-spacing:2px; text-align:center;
  -webkit-appearance:none; border-radius:0;
  transition:background 0.1s, color 0.1s;
}
.battle-undo-floating:active {
  background:var(--bg2); color:var(--accent);
}

/* ── RESULT ── */
.result-wrap { flex:1; display:flex; flex-direction:column; }
.result-left {
  background:var(--bg1); border-bottom:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center;
  padding:32px 16px; gap:20px;
}
.result-eyebrow { font-size:7px; color:var(--bg3); letter-spacing:3px; }
.result-sprite { width:120px; height:120px; image-rendering:pixelated; }
.result-name { font-size:14px; color:var(--accent); letter-spacing:2px; text-align:center; line-height:1.8; }
.result-num { font-size:8px; color:var(--bg3); letter-spacing:2px; }
.result-badge { font-size:8px; color:var(--fg4); border:1px solid var(--bg3); padding:6px 12px; letter-spacing:2px; }
.result-right { background:var(--bg0); padding:24px 16px; display:flex; flex-direction:column; }
.result-stat { border-bottom:1px solid var(--bg1); padding:12px 0; display:flex; justify-content:space-between; align-items:baseline; }
.result-stat-label { font-size:8px; color:var(--bg3); letter-spacing:1px; }
.result-stat-val { font-size:11px; color:var(--fg5); }
.result-saved { font-size:8px; color:var(--bg3); letter-spacing:1px; margin-top:16px; line-height:2.5; }
.guest-save-note { font-size:8px; color:var(--fg4); line-height:2.2; margin-bottom:18px; border:1px solid var(--bg3); padding:16px; }
.result-actions { display:flex; flex-direction:column; gap:14px; margin-top:24px; }

/* ── TEAM REVEAL ── */
.team-reveal-wrap {
  flex:1; display:flex; flex-direction:column; align-items:center;
  padding:32px 18px 80px; gap:20px; text-align:center;
}

/* ── LANDING ── */
.landing { flex:1; display:flex; flex-direction:column; overflow-x:hidden; max-width:100%; }

.landing-hero {

  padding:36px 24px 40px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:20px;
  position:relative; overflow:hidden;
}
.landing-eyebrow { font-size:7px; color:var(--fg4); letter-spacing:4px; }

/* ── HERO VS SCENE — Gengar vs Nidorino, the RB intro battle ──
   The two fighters sit large & semi-transparent BEHIND the title, charging
   toward the centre where the glowing logo overlays the clash. */
.landing-titlewrap {
  position:relative; align-self:stretch;
  display:flex; align-items:center; justify-content:center;
  min-height:130px;
}
.landing-vs {
  position:absolute; inset:0; z-index:0; pointer-events:none;
  display:flex; align-items:center; justify-content:center; gap:40px;
}
.landing-vs-cell {
  width:200px; height:200px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.landing-vs-cell.fighter-l { animation:fight-l 2.6s ease-in-out infinite; }
.landing-vs-cell.fighter-r { animation:fight-r 2.6s ease-in-out infinite; }
.landing-vs-sprite {
  width:100%; height:100%; object-fit:contain;
  image-rendering:pixelated; opacity:0.5;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,0.45));
}
.landing-vs-sprite.flip { transform:scaleX(-1); }
/* Nidorino (left): idle wobble, then charges right into the clash */
@keyframes fight-l {
  0%,100%{ transform:translate(0,0) rotate(0) }
  12%{ transform:translate(0,-5px) }
  24%{ transform:translate(0,0) }
  40%{ transform:translate(50px,-3px) rotate(5deg) }
  47%{ transform:translate(16px,0) rotate(0) }
  60%{ transform:translate(0,0) }
  82%{ transform:translate(0,-4px) }
}
/* Gengar (right): idle wobble, then lunges left into the clash (offset timing) */
@keyframes fight-r {
  0%,100%{ transform:translate(0,0) rotate(0) }
  12%{ transform:translate(0,-4px) }
  24%{ transform:translate(0,0) }
  56%{ transform:translate(-50px,-4px) rotate(-5deg) }
  63%{ transform:translate(-16px,0) rotate(0) }
  76%{ transform:translate(0,0) }
  88%{ transform:translate(0,-5px) }
}
/* Title sits above the fighters and flashes briefly on each clash */
@keyframes titleimpact {
  0%,38%,100%{ text-shadow:0 0 4px var(--accent) }
  41%{ text-shadow:0 0 9px var(--accent) }
  47%{ text-shadow:0 0 4px var(--accent) }
  57%{ text-shadow:0 0 9px var(--accent) }
  63%{ text-shadow:0 0 4px var(--accent) }
}

  animation:titleimpact 2.6s ease-in-out infinite; }

/* ── LANDING VINTAGE FX ── */
/* chunky pixel scroll-reveal (sections rise in on scroll) */
.landing .reveal { opacity:0; transform:translateY(18px); }
.landing .reveal.in { opacity:1; transform:none;
  transition:opacity .45s steps(6), transform .45s steps(6); }

/* gen cards: hover glow + Game Boy window corner brackets */
.landing-gen { position:relative; transition:box-shadow .2s, background .2s; }
.landing-gen::before, .landing-gen::after {
  content:''; position:absolute; width:12px; height:12px;
  border:2px solid var(--accent); opacity:0.3; pointer-events:none; transition:opacity .2s;
}
.landing-gen::before { top:12px; left:12px; border-right:none; border-bottom:none; }
.landing-gen::after { bottom:12px; right:12px; border-left:none; border-top:none; }
.landing-gen:hover { box-shadow:inset 0 0 0 1px var(--accent), 0 0 22px -12px var(--accent); }
.landing-gen:hover::before, .landing-gen:hover::after { opacity:0.8; }

/* sprite rows — static, just a pop on hover (no idle wobble) */
.landing-gen-sprites img { transition:transform .15s, filter .15s; }
.landing-gen-sprites img:hover { transform:translateY(-4px) scale(1.12); filter:drop-shadow(0 0 6px var(--accent)); }

/* challenge cards on landing: hover glow */
.landing-challenge-card { transition:transform .15s, box-shadow .2s, border-color .2s; }
.landing-challenge-card:hover { transform:translateY(-2px); box-shadow:0 0 24px -10px #ffd060; border-color:#ffd060; }

/* feature tiles: lift + glowing icon */
.landing-feature { transition:transform .15s; }
.landing-feature:hover { transform:translateY(-3px); }
.landing-feature-icon { text-shadow:0 0 5px var(--accent); }

/* CRT vignette over the viewport while on the landing */
.landing::after {
  content:''; position:fixed; inset:0; z-index:3; pointer-events:none;
  background:radial-gradient(ellipse 110% 90% at 50% 45%, transparent 58%, rgba(0,0,0,0.35) 100%);
}

/* ── IN-APP VINTAGE FX (light) ── */
/* GB-window corner brackets + hover glow on challenge cards */
.challenge-card { position:relative; transition:background .1s, border-color .1s, box-shadow .2s; }
.challenge-card::before, .challenge-card::after {
  content:''; position:absolute; width:9px; height:9px;
  border:2px solid var(--accent); opacity:0.22; pointer-events:none; transition:opacity .2s;
}
.challenge-card::before { top:8px; left:8px; border-right:none; border-bottom:none; }
.challenge-card::after { bottom:8px; right:8px; border-left:none; border-top:none; }
.challenge-card:hover { box-shadow:0 0 20px -12px var(--accent); }
.challenge-card:hover::before, .challenge-card:hover::after { opacity:0.7; }
/* hover glow on the main interactive cards/buttons */
.mode-btn, .type-btn, .menu-btn, .lb-card { transition:background .15s, border-color .15s, box-shadow .2s, transform .15s; }
.mode-btn:hover, .type-btn:hover, .menu-btn:hover, .lb-card:hover { box-shadow:0 0 18px -12px var(--accent); }
.type-btn:hover { transform:translateY(-2px); }
/* phosphor only on the big titles where it actually reads well */
.team-reveal-title { text-shadow:0 0 6px var(--accent); }
@media (hover:none){
  /* no hover glints on touch — keep it light */
  .mode-btn:hover, .type-btn:hover, .menu-btn:hover, .lb-card:hover, .challenge-card:hover { box-shadow:none; transform:none; }
}

/* ── ACCESSIBILITY: respect reduced-motion ── */
@media (prefers-reduced-motion: reduce){
  .fighter-l, .fighter-r, .landing-title,
  .pokemon-card.winner, .pokemon-card.winner .poke-sprite, .pokemon-card.winner::after,
  .pokemon-card.loser, .inprog-dot, .pixel-cursor {
    animation:none !important;
  }
  .landing .reveal { opacity:1 !important; transform:none !important; transition:none !important; }
  .pokemon-card.loser { opacity:0.2; }
  * { scroll-behavior:auto !important; }
}

// PS-compatible name map for special cases
const PS_NAMES = {29:'nidoran-f',32:'nidoran-m',83:'farfetchd',122:'mr-mime',
  185:'sudowoodo',201:'unown',250:'ho-oh',351:'castform',386:'deoxys'};
function getPSName(id){
  if(PS_NAMES[id]) return PS_NAMES[id];
  const pkm = (id<=151?PKM1:id<=251?PKM2:id<=386?PKM3:id<=493?PKM4:PKM5).find(p=>p.id===id);
  if(!pkm) return 'missingno';
  return pkm.name.toLowerCase().replace(/[^a-z0-9]/g,'-');
}

function sprite(id, gen) {
  const sources = SPRITE_SOURCES[gen] || SPRITE_SOURCES[1];
  return sources[0](id);
}

// build onerror chain for fallback loading
function spriteWithFallback(id, gen, cls, extraStyle) {
  const sources = SPRITE_SOURCES[gen] || SPRITE_SOURCES[1];
  const s = extraStyle ? ' style="'+extraStyle+'"' : '';
  // encode fallback chain into data attributes
  const fallbacks = sources.slice(1).map(fn=>fn(id)).join('|');
  return '<img class="'+cls+'" src="'+sources[0](id)+'"'
    +' data-fallbacks="'+fallbacks+'"'
    +' onerror="spriteFallback(this)"'
    +s+'>';
}

function spriteFallback(img) {
  const fallbacks = (img.getAttribute('data-fallbacks')||'').split('|').filter(Boolean);
  if(fallbacks.length === 0) {
    // all sources failed — show pixel placeholder
    img.style.display = 'none';
    const ph = document.createElement('div');
    ph.className = img.className + ' sprite-ph';
    ph.textContent = '?';
    ph.style.cssText = 'display:flex;align-items:center;justify-content:center;font-family:var(--px);color:var(--bg3);font-size:11px;background:var(--bg2);width:'+img.width+'px;height:'+img.height+'px;';
    img.parentNode.insertBefore(ph, img);
    return;
  }
  img.setAttribute('data-fallbacks', fallbacks.slice(1).join('|'));
  img.src = fallbacks[0];
}

// for cross-gen challenges: use the pokémon's own origin gen for sprite
function spriteByOriginGen(p, cls, extraStyle){
  return spriteWithFallback(p.id, p.gen||S.gen, cls, extraStyle);
}

async function migrateGuestPicksToUser(uid, picks){
  let picksMigrated = false;
  try {
    for(const [cat,p] of Object.entries(picks||{}).filter(([,p])=>p&&p.id)) await saveFav(uid,cat,p);
    picksMigrated = true;
    clearGuestPicks();
  } catch(e){ console.warn('migrate picks failed:', e); }
  // also migrate guest teams (cached in localStorage)
  try {
    const guestTeams = loadGuestTeams();
    for(const [cat, members] of Object.entries(guestTeams||{})){
      if(Array.isArray(members) && members.length>1){
        await sb.from('pokemon_teams').upsert({
          user_id: uid,
          category: cat,
          members: members,
          updated_at: new Date().toISOString(),
        }, {onConflict:'user_id,category'});
      }
    }
    clearGuestTeams();
  } catch(e){ console.warn('migrate teams failed:', e); }
}

// ── SESSION PERSISTENCE
async function saveSession() {
  if(!S.user||S.isGuest) return;
  // Skip saving for small linear challenges, but keep mega-bracket challenges saved
  if(S.mode==='challenge' && !S.bracket) return;
  // For bracket mode: persist S.bracket inside pool field as a wrapper {__bracket:{...}}
  // For linear mode: persist S.pool as before
  let payload;
  if(S.bracket){
    payload={__bracket:S.bracket};
  } else if(S.pool.length>1){
    payload=S.pool;
  } else {
    return; // nothing to save
  }
  const ft=S.filterType||'__none__';
  const {error} = await sb.from('pokemon_sessions').upsert({
    user_id:S.user.id,
    gen:S.gen,
    mode:S.mode,
    filter_type:ft,
    pool:payload,
    round:S.round,
    total:S.total,
    streak:S.streak,
    max_streak:S.maxStreak,
    updated_at:new Date().toISOString()
  },{onConflict:'user_id,gen,mode,filter_type'});
  if(error) console.error('saveSession error:', error.message);
}

async function deleteSession() {
  if(!S.user||S.isGuest) return;
  const ft=S.filterType||'__none__';
  await sb.from('pokemon_sessions')
    .delete()
    .eq('user_id',S.user.id)
    .eq('gen',S.gen)
    .eq('mode',S.mode)
    .eq('filter_type',ft);
}

async function loadActiveSessions(uid) {

  return data||[];
}

async function resumeSession(sess) {
  S.gen=sess.gen;
  S.mode=sess.mode;
  S.filterType=sess.filter_type==='__none__'?null:sess.filter_type;
  // Detect bracket vs linear payload
  if(sess.pool && typeof sess.pool==='object' && !Array.isArray(sess.pool) && sess.pool.__bracket){
    S.bracket=sess.pool.__bracket;
    S.pool=sess.pool.__bracket.initialPool||[];
  } else {
    S.bracket=null;
    S.pool=sess.pool;
  }
  S.round=sess.round;
  S.total=sess.total;
  S.streak=sess.streak;
  S.maxStreak=sess.max_streak;
  S.winner=null;
  S.history=[];
  S.screen='battle';
  S.currentView='game';
  document.body.className=S.gen===1?'gen1':S.gen===2?'gen2':S.gen===3?'gen3':S.gen===4?'gen4':'gen5';
  updateLogoSubtitle();
  render();
}

async function abandonSession() {
  await deleteSession();
  S.activeSessions=await loadActiveSessions(S.user.id);
  S.screen='menu';S.currentView='game';
  S.pool=[];S.round=0;S.total=0;S.streak=0;S.maxStreak=0;S.winner=null;
  render();
}

async function loadPokemonLb(mode) {
  const prefix=genPrefix();
  const catPrefixed=mode==='overall'?prefix+'overall':prefix+'type_'+mode;

  const cats=[catPrefixed];

  }

async function doAuth() {
  const isReg=S.authMode==='register';
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-pass').value;
  const nick=isReg?document.getElementById('auth-nick').value.trim():null;
  const msg=document.getElementById('auth-msg');
  if(!email||!pass){msg.textContent='▶ ENTER EMAIL AND PASSWORD';msg.className='auth-msg error';return;}
  if(isReg&&!nick){msg.textContent='▶ ENTER A NICKNAME';msg.className='auth-msg error';return;}
  if(isReg){
    const termsBox=document.getElementById('auth-terms');
    if(!termsBox||!termsBox.checked){msg.textContent='▶ YOU MUST ACCEPT THE TERMS AND PRIVACY POLICY';msg.className='auth-msg error';return;}
  }
  msg.textContent='▶ ...';msg.className='auth-msg';S.busy=true;
  // Collect picks to migrate: from current guest session OR orphan localStorage picks
  let guestPicks=S.isGuest?{...(S.favorites||{})}:null;
  if(!guestPicks){
    const orphan=loadGuestPicks();
    if(orphan && Object.keys(orphan).length>0) guestPicks=orphan;
  }
  const wasGuest=S.isGuest;
  let error;
  try{
    if(isReg){
      if(wasGuest){try{await sb.auth.signOut();}catch(e){}}
      const r=await sb.auth.signUp({email,password:pass});
      error=r.error;
      if(!error){
        if(r.data.user){
          await upsertProfile(r.data.user.id,nick);
          if(guestPicks) await migrateGuestPicksToUser(r.data.user.id,guestPicks);
        }
        if(r.data.session&&r.data.user){
          S.user=r.data.user;S.isGuest=false;S.guestLocalOnly=false;
          S.profile=await loadProfile(S.user.id);S.favorites=await loadFavs(S.user.id);S.teams=await loadTeams(S.user.id);S.activeSessions=await loadActiveSessions(S.user.id);
          S.screen='menu';S.currentView='game';S.guestAuthReturn=null;S.busy=false;render();return;
        }
        msg.innerHTML='▶ ACCOUNT CREATED!<br><br>CHECK YOUR INBOX FOR A CONFIRMATION EMAIL.<br>★ CHECK SPAM FOLDER TOO — FIRST EMAILS OFTEN LAND THERE.<br><br>CLICK THE LINK, THEN LOG IN.';msg.className='auth-msg';S.busy=false;return;
      }
    } else {
      const r=await sb.auth.signInWithPassword({email,password:pass});
      error=r.error;
      if(!error){S.user=r.data.user;S.isGuest=false;S.guestLocalOnly=false;if(guestPicks) await migrateGuestPicksToUser(S.user.id,guestPicks);}
    }
  }catch(e){error=e;}
  S.busy=false;
  if(error){
    if(wasGuest){S.user={id:'local-guest'};S.isGuest=true;S.favorites=guestPicks||loadGuestPicks();}
    let errMsg=(error.message||'').toUpperCase();
    if(errMsg.includes('RATE LIMIT')||errMsg.includes('TOO MANY')||errMsg.includes('429')){
      msg.innerHTML='▶ TOO MANY REQUESTS.<br>PLEASE WAIT A MOMENT BEFORE TRYING AGAIN.';
    } else if(errMsg.includes('NOT CONFIRMED')||errMsg.includes('CONFIRMATION')){
      msg.innerHTML='▶ EMAIL NOT CONFIRMED YET.<br><br>CHECK YOUR INBOX (AND SPAM FOLDER)<br>FOR THE CONFIRMATION LINK.';
    } else if(errMsg.includes('INVALID') && errMsg.includes('CREDENTIAL')){
      msg.textContent='▶ INVALID EMAIL OR PASSWORD';
    } else if(errMsg.includes('USER ALREADY')||errMsg.includes('ALREADY REGISTERED')){
      msg.textContent='▶ AN ACCOUNT WITH THIS EMAIL ALREADY EXISTS. TRY LOGGING IN.';
    } else if(errMsg.includes('PASSWORD') && errMsg.includes('SHORT')){
      msg.textContent='▶ PASSWORD TOO SHORT (MIN 6 CHARACTERS)';
    } else if(errMsg.includes('INVALID') && errMsg.includes('EMAIL')){
      msg.textContent='▶ INVALID EMAIL ADDRESS';
    } else {
      msg.textContent='▶ '+(errMsg||'ERROR');
    }
    msg.className='auth-msg error';return;
  }
  try{const nick=localStorage.getItem('pending_nick');if(nick){await upsertProfile(S.user.id,nick);localStorage.removeItem('pending_nick');}}catch(e){}
  S.profile=await loadProfile(S.user.id);S.favorites=await loadFavs(S.user.id);S.teams=await loadTeams(S.user.id);S.activeSessions=await loadActiveSessions(S.user.id);
  S.screen='menu';S.currentView='game';S.guestAuthReturn=null;render();
}

// ── GAME ──
// ── BRACKET TOURNAMENT ──
// Use bracket mode when pool > 10 (more than 10 Pokémon makes linear elimination tedious).
// Challenges always use linear (small pools).
const BRACKET_THRESHOLD = 10;
const TEAM_SIZE = 6;
// Modes that activate the "build team of 6" flow before final 1-on-1.
// Type battles stay single-winner. Small challenges stay linear.
function useTeamFlowFor(mode, filterType){
  if(mode === 'overall') return true;
  if(mode === 'challenge' && filterType === 'worldchamp') return true;
  return false;
}
function useBracketFor(poolLen, mode){
  // Bracket activates for any pool >10 except small challenges (which stay linear).
  // The startChallenge function handles its own decision.
  return poolLen>BRACKET_THRESHOLD;
}

// Build initial bracket state from a shuffled pool
function buildBracket(pool){
  const totalRounds = Math.ceil(Math.log2(pool.length));
  const matches = [];
  // First round: pair Pokémon. Odd one gets a BYE (auto-advances).
  for(let i=0; i<pool.length; i+=2){
    if(i+1<pool.length){
      matches.push([pool[i], pool[i+1]]);
    }
    // odd one is added directly to winners (BYE)
  }
  const byeWinner = pool.length%2===1 ? [pool[pool.length-1]] : [];
  return {
    roundIndex: 0,
    totalRounds,
    currentMatchIndex: 0,
    matches,
    winners: byeWinner,           // winners advancing to next round
    survivors: [...byeWinner],    // all survivors of current round (so far)
    initialPool: pool.slice(),    // for restart
  };
}

// Get current pair for the battle UI
function bracketCurrentPair(b){
  if(!b||!b.matches) return null;
  return b.matches[b.currentMatchIndex] || null;
}

// Total picks in this bracket — sum of all matches across all rounds (excluding byes)
function bracketTotalMatches(initialSize){
  // each round halves with possible bye; total picks = initialSize - 1
  return initialSize - 1;
}

// How many picks done so far across all rounds
function bracketPicksDone(b){
  if(!b) return 0;
  // matches done in previous rounds + matches done in current round
  // we don't track previous — but: total picks done = (initial - currentSurvivorsAndWaiting)
  // simpler: track explicitly. Add a 'totalPicks' counter.
  return b.totalPicks||0;
}

// Round labels: SEMI, FINAL, etc. or ROUND N
function bracketRoundLabel(b){
  if(!b) return '';
  const remaining = b.totalRounds - b.roundIndex;
  if(remaining===1) return 'FINAL';
  if(remaining===2) return 'SEMIFINAL';
  if(remaining===3) return 'QUARTERFINAL';
  // For early rounds, show "ROUND N OF M"
  return 'ROUND '+(b.roundIndex+1)+'/'+b.totalRounds;
}

// Advance to next round (or finish)
function bracketAdvanceRound(b){
  // current matches all done; b.winners has all survivors of this round
  if(b.winners.length<=1) return; // end
  const survivors = b.winners.slice();
  const N = survivors.length;
  
  // TEAM MODE: when about to drop below TEAM_SIZE+1, build a custom round
  // that produces EXACTLY TEAM_SIZE survivors (instead of N/2).
  const inTeamMode = useTeamFlowFor(S.mode, S.filterType);
  if(inTeamMode && N > TEAM_SIZE && N <= TEAM_SIZE*2){
    // We need (N - TEAM_SIZE) matches and (2*TEAM_SIZE - N) byes to land exactly on TEAM_SIZE.
    const matchesNeeded = N - TEAM_SIZE;
    const byesNeeded = N - 2*matchesNeeded;
    // Pair the first 2*matchesNeeded survivors into matchesNeeded matches; the rest go BYE.
    const nextMatches = [];
    for(let i=0; i<2*matchesNeeded; i+=2){
      nextMatches.push([survivors[i], survivors[i+1]]);
    }
    const byes = survivors.slice(2*matchesNeeded);
    b.roundIndex++;
    b.matches = nextMatches;
    b.currentMatchIndex = 0;
    b.winners = byes.slice();        // BYE survivors auto-advance
    b.survivors = byes.slice();
    return;
  }
  
  // STANDARD: pair adjacent survivors; odd one gets a BYE.
  const nextMatches = [];
  for(let i=0; i<N; i+=2){
    if(i+1<N){
      nextMatches.push([survivors[i], survivors[i+1]]);
    }
  }
  const byeWinner = N%2===1 ? [survivors[N-1]] : [];
  b.roundIndex++;
  b.matches = nextMatches;
  b.currentMatchIndex = 0;
  b.winners = byeWinner;
  b.survivors = [...byeWinner];
}

// In team mode, check if we've reached the team size exactly.
// We freeze when winners.length == TEAM_SIZE (or fewer if BYE forced it lower).
function bracketShouldFreezeAsTeam(b){
  if(b.winners.length<=1) return false; // can't freeze with 1 — that's just the champion
  return b.winners.length<=TEAM_SIZE;
}

async function startGame(mode,ft){
  if(S.busy) return;
  S.busy=true;
  try {
  // check for saved session first — registered users only
  if(S.user&&!S.isGuest){
    const ft2=(ft||'__none__');
    const {data:rows} = await sb.from('pokemon_sessions')
      .select('*').eq('user_id',S.user.id).eq('gen',S.gen).eq('mode',mode).eq('filter_type',ft2).limit(1);
    const existing = rows && rows.length > 0 ? rows[0] : null;
    if(existing && existing.pool){
      const isBracket = typeof existing.pool==='object' && !Array.isArray(existing.pool) && existing.pool.__bracket;
      const hasMore = isBracket ? (existing.pool.__bracket.winners.length+ (existing.pool.__bracket.matches.length-existing.pool.__bracket.currentMatchIndex)*2 > 1) : existing.pool.length > 1;
      if(hasMore){
        await resumeSession(existing);
        return;
      }
    }
  }
  // no session — start fresh. Clear the previous champion for this run so the card becomes empty while replaying.
  const cat=categoryFor(mode,ft);
  await clearFavorite(cat);
  const pkm=currentPKM();
  const pool=ft?shuffle(pkm.filter(p=>p.types.includes(ft))):shuffle([...pkm]);
  if(pool.length===0){
    S.busy=false;
    alert('No Pokémon of this type in this generation.');
    return;
  }
  if(pool.length===1){
    // only one — auto-win
    Object.assign(S,{mode,filterType:ft||null,pool,round:0,total:0,streak:0,maxStreak:0,winner:pool[0],screen:'result',currentView:'game',history:[]});
    await autoSave(cat,pool[0]);
    render();
    return;
  }
  if(useBracketFor(pool.length,mode)){
    // BRACKET MODE
    const bracket=buildBracket(pool);
    bracket.totalPicks=0;
    Object.assign(S,{
      mode,filterType:ft||null,
      pool, // kept for backwards-compat with session restore
      round:0,total:bracketTotalMatches(pool.length),
      streak:0,maxStreak:0,winner:null,
      screen:'battle',currentView:'game',history:[],
      bracket,
    });
  } else {
    // LINEAR MODE
    Object.assign(S,{mode,filterType:ft||null,pool,round:0,total:pool.length-1,streak:0,maxStreak:0,winner:null,screen:'battle',currentView:'game',history:[],bracket:null});
  }
  render();
  } finally {
    S.busy=false;
  }
}

// ── TEAM PHASE ── linear elimination of the 6 chosen pokémon to find the ace
function startTeamPhase(){
  console.log('[startTeamPhase] called, team:', S.team, 'busy:', S.busy, 'screen:', S.screen);
  // Reset busy flag (might be lingering from chooseBracket)
  S.busy=false;
  if(!S.team || S.team.length<2){
    console.warn('[startTeamPhase] no/small team, returning');
    if(S.team && S.team.length===1){
      S.winner=S.team[0];
      const cat=S.mode==='challenge'?'ch_'+S.filterType:(genPrefix()+(S.mode==='type'?'type_'+S.filterType:'overall'));
      autoSave(cat,S.winner);
      S.screen='result';
      render();
      return;
    }
    console.warn('startTeamPhase called but no team');
    return;
  }
  S.teamPhase=true;
  // Setup linear elimination over the team — shuffle so order isn't predictable
  const pool=shuffle([...S.team]);
  S.pool=pool;
  S.round=0;
  S.total=pool.length-1;
  S.streak=0;
  S.maxStreak=0;
  S.winner=null;
  S.history=[];
  S.bracket=null;
  S.screen='battle';
  S.currentView='game';
  render();
}

async function saveTeam(category, team){
  // Always cache locally first so UI updates immediately
  const members = team.map(p => ({id:p.id, name:p.name, types:p.types, gen:p.gen||genFromId(p.id)}));
  if(!S.teams) S.teams={};
  S.teams[category] = members;
  // Persist to localStorage for guests (so they survive reload)
  if(S.isGuest) saveGuestTeams();
  // Save to DB if we have a user (registered or anonymous-signed-in guest)
  if(!S.user || S.guestLocalOnly) return;
  try {
    const {error} = await sb.from('pokemon_teams').upsert({
      user_id: S.user.id,
      category: category,
      members: members,
      updated_at: new Date().toISOString(),
    }, {onConflict:'user_id,category'});
    if(error) console.warn('saveTeam DB error:', error.message);
  } catch(e){
    console.warn('saveTeam failed:', e);
  }
}

// Persist guest teams to localStorage
function guestTeamsKey(){ return 'poke_guest_teams_v1'; }
function loadGuestTeams(){ try{return JSON.parse(localStorage.getItem(guestTeamsKey())||'{}')||{};}catch(e){return {};} }
function saveGuestTeams(){ if(!S.isGuest) return; try{localStorage.setItem(guestTeamsKey(), JSON.stringify(S.teams||{}));}catch(e){} }
function clearGuestTeams(){ try{localStorage.removeItem(guestTeamsKey());}catch(e){} }

async function choose(idx){
  if(S.busy)return;S.busy=true;
  // BRACKET MODE
  if(S.bracket){
    return chooseBracket(idx);
  }
  // LINEAR MODE
  const chosen=S.pool[idx];
  S.history=[{pool:S.pool.slice(),round:S.round,streak:S.streak,maxStreak:S.maxStreak,winner:S.winner,clickedIdx:idx}];
  const cards=document.querySelectorAll('.pokemon-card');
  cards[idx].classList.add('winner');
  cards[1-idx].classList.add('loser');
  const footer=document.querySelector('.battle-footer-text');
  if(footer) footer.innerHTML='▶ '+chosen.name+' ADVANCES!<span class="battle-helper-text">NEXT MATCH LOADING…</span>';
  S.streak++;if(S.streak>S.maxStreak)S.maxStreak=S.streak;
  S.round++;
  const rest=S.pool.slice(2);
  const nextChallenger=rest.length>0?rest[0]:null;
  const remaining=rest.slice(1);
  if(nextChallenger){
    const newPool=[];
    newPool[idx]=chosen;
    newPool[1-idx]=nextChallenger;
    S.pool=[...newPool, ...remaining];
  } else {
    S.pool=[chosen];
  }
  if(S.mode!=='challenge'&&!S.isGuest) saveSession();
  if(S.round%10===0&&S.pool.length>1){
    const cat=S.mode==='challenge'?'ch_'+S.filterType:(genPrefix()+(S.mode==='type'?'type_'+S.filterType:'overall'));
    autoSave(cat,chosen);
  }
  await new Promise(r=>setTimeout(r,250));
  if(S.pool.length===1){
    S.winner=S.pool[0];
    const cat=S.mode==='challenge'?'ch_'+S.filterType:(genPrefix()+(S.mode==='type'?'type_'+S.filterType:'overall'));
    autoSave(cat,S.pool[0]);
    if(S.mode!=='challenge'&&!S.isGuest){
      deleteSession().then(()=>{
        S.activeSessions=S.activeSessions.filter(s=>!(s.gen===S.gen&&s.mode===S.mode&&(s.filter_type||'__none__')===(S.filterType||'__none__')));
      });
    }
    // If we were in the team phase (linear elimination of 6 chosen ones), reset
    if(S.teamPhase){ S.teamPhase=false; }
    S.screen='result';
    S.busy=false;render();
    return;
  }
  async function chooseBracket(idx){
  const b=S.bracket;
  const pair=b.matches[b.currentMatchIndex];
  if(!pair) { S.busy=false; return; }
  const chosen=pair[idx];
  const loser=pair[1-idx];

  // save snapshot for undo
  S.history=[{
    bracket:JSON.parse(JSON.stringify(b)),
    round:S.round,streak:S.streak,maxStreak:S.maxStreak,winner:S.winner,clickedIdx:idx,
  }];

  // animate
  const cards=document.querySelectorAll('.pokemon-card');
  if(cards[idx]) cards[idx].classList.add('winner');
  if(cards[1-idx]) cards[1-idx].classList.add('loser');
  const footer=document.querySelector('.battle-footer-text');
  if(footer) footer.innerHTML='▶ '+chosen.name+' ADVANCES!<span class="battle-helper-text">NEXT MATCH LOADING…</span>';

  S.streak++;if(S.streak>S.maxStreak)S.maxStreak=S.streak;
  S.round++;
  b.totalPicks=(b.totalPicks||0)+1;
  b.winners.push(chosen);
  b.survivors.push(chosen);
  b.currentMatchIndex++;

  // periodic autosave
  if(S.round%10===0){
    const cat=S.mode==='challenge'?'ch_'+S.filterType:(genPrefix()+(S.mode==='type'?'type_'+S.filterType:'overall'));
    autoSave(cat,chosen);
  }
  if(!S.isGuest) saveSession();

  await new Promise(r=>setTimeout(r,250));

  // round complete?
  if(b.currentMatchIndex>=b.matches.length){
    // advance round
    if(b.winners.length===1){
      // CHAMPION!
      S.winner=b.winners[0];
      S.bracket=null;
      const cat=S.mode==='challenge'?'ch_'+S.filterType:(genPrefix()+(S.mode==='type'?'type_'+S.filterType:'overall'));
      autoSave(cat,S.winner);
      if(!S.isGuest){
        deleteSession().then(()=>{
          S.activeSessions=S.activeSessions.filter(s=>!(s.gen===S.gen&&s.mode===S.mode&&(s.filter_type||'__none__')===(S.filterType||'__none__')));
        });
      }
      S.screen='result';
      S.busy=false;render();
      return;
    }
    // TEAM MODE: when survivors ≤ 6, freeze team and show interstitial
    if(useTeamFlowFor(S.mode, S.filterType) && bracketShouldFreezeAsTeam(b)){
      S.team = b.winners.slice(); // 2..6 survivors become the team
      S.bracket = null;
      // Save team to DB (overwrites any previous team for this category)
      const cat=S.mode==='challenge'?'ch_'+S.filterType:(genPrefix()+(S.mode==='type'?'type_'+S.filterType:'overall'));
      saveTeam(cat, S.team);
      if(!S.isGuest){
        // Don't delete session yet — we still need to save the linear team-phase progress
      }
      S.screen='team_reveal';
      S.busy=false;render();
      return;
    }
    bracketAdvanceRound(b);
  }
  S.busy=false;
  render();
}

// surgical DOM update — only swap card content, no full re-render
  const g=S.gen;
  const p0=S.pool[0],p1=S.pool[1];
  const prog=S.total>0?(S.round/S.total*100):0;
  const pf=document.querySelector('.progress-fill');
  if(pf) pf.style.width=prog+'%';
  const bc=document.querySelector('.battle-count');
  if(bc) bc.textContent=S.round+' / '+S.total;
  const bs=document.querySelector('.battle-streak');
  if(bs) bs.textContent='STREAK: '+S.streak;
  function updateCard(card, p){
    const img=card.querySelector('.poke-sprite');
    const num=card.querySelector('.poke-num');
    const name=card.querySelector('.poke-name');
    const type=card.querySelector('.poke-type');
    const genBadge=card.querySelector('.poke-gen-badge');
    if(num) num.textContent='#'+String(p.id).padStart(3,'0');
    if(name) name.textContent=p.name;
    if(type) type.innerHTML=typeIconsHTML(p.types,18,S.mode==='challenge'&&p.gen?p.gen:null);
    if(genBadge) genBadge.textContent='GEN '+(p.gen===1?'I':p.gen===2?'II':p.gen===3?'III':p.gen===4?'IV':'V');
    if(img){
      const useGen=S.mode==='challenge'&&p.gen?p.gen:g;
      img.src=sprite(p.id,useGen);
      img.setAttribute('data-fallbacks',(SPRITE_SOURCES[useGen]||SPRITE_SOURCES[1]).slice(1).map(fn=>fn(p.id)).join('|'));
      img.onerror=function(){spriteFallback(this);};
    }
    card.classList.remove('winner','loser');
  }
  if(cards[0]&&cards[1]){
    updateCard(cards[0],p0);
    updateCard(cards[1],p1);
    cards[0].onclick=()=>choose(0);
    cards[1].onclick=()=>choose(1);
  } else {
    render();
  }
  if(footer) footer.textContent='▶ CLICK YOUR FAVOURITE';
  // swap placeholder/floating undo button if needed
  const placeholder=document.querySelector('.battle-undo-placeholder');
  const floating=document.querySelector('.battle-undo-floating');
  if(S.history&&S.history.length>0&&placeholder&&!floating){
    const btn=document.createElement('button');
    btn.className='battle-undo-floating';
    btn.innerHTML='&#8630; UNDO LAST PICK';
    btn.onclick=undoLastPick;
    placeholder.replaceWith(btn);
  }
  S.busy=false;
}

async function openLeaderboard(scope){
  S.currentView='leaderboard';
  S.lbScope=scope; // 'gen' or 'challenge'
  if(scope==='gen'){
    // default to pokemon view, overall mode
    S.lbView='pokemon';
    if(!S.lbMode) S.lbMode='overall';
    S.section='generations';
  } else {
    S.lbView='challenge_pkm';
    if(!S.lbChallenge) S.lbChallenge='starters';
    S.section='challenges';
  }
  S.lbData=null;
  render();
  const view=S.lbView;
  console.log('[LB] Loading:',scope,view,S.lbChallenge||S.lbMode);
  let result=[];
  try {
    if(view==='pokemon') result=await loadPokemonLb(S.lbMode);
    else if(view==='challenge_pkm') result=await loadChallengeLb(S.lbChallenge);
    console.log('[LB] Got '+(result?result.length:0)+' results');
  } catch(e){
    console.error('[LB] Load error:',e);
    result=[];
  }
  if(S.currentView!=='leaderboard') return;
  else S.lbData=result||[];
  render();
}

// Chunky pixel scroll-reveal for the landing sections below the hero.
function setupLandingFX(){
  const els=document.querySelectorAll('.landing-gen, .landing-challenges, .landing-coming, .landing-features, .landing-footer-cta');
  if(!els.length) return;
  els.forEach(el=>el.classList.add('reveal'));
  if(!('IntersectionObserver' in window)){ els.forEach(el=>el.classList.add('in')); return; }
  const io=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:0.12, rootMargin:'0px 0px -8% 0px'});
  els.forEach(el=>io.observe(el));
}

// ── SHARE STORY (canvas 1080x1920) ──
async function shareStory(){
  const winner=S.winner;if(!winner) return;
  const useGen=S.mode==='challenge'&&winner.gen?winner.gen:S.gen;
  const W=1080,H=1920;
  const canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.imageSmoothingEnabled=false;

  // theme colors based on gen
  const themes={
    1:{bg:'#0a0f0a',bg2:'#1a3a1a',accent:'#c8ff00',fg:'#9bbc0f',fg4:'#3d8c3d'},
    2:{bg:'#0d0b1a',bg2:'#1e1b3a',accent:'#ffe040',fg:'#e8c800',fg4:'#6a5acd'},
    3:{bg:'#0f0a08',bg2:'#3a1a08',accent:'#ff4800',fg:'#f09038',fg4:'#c05020'},
    4:{bg:'#080c12',bg2:'#1a2540',accent:'#7cc8ff',fg:'#c0d4ec',fg4:'#5a78a8'},
    5:{bg:'#06070a',bg2:'#1d1f28',accent:'#ff5050',fg:'#e8e8ec',fg4:'#7c828c'},
    ch:{bg:'#08101a',bg2:'#15264a',accent:'#ffd060',fg:'#e0b860',fg4:'#5570a0'}
  };
  const t=S.mode==='challenge'?themes.ch:(themes[useGen]||themes[1]);

  // background
  ctx.fillStyle=t.bg;ctx.fillRect(0,0,W,H);

  // scanline overlay
  ctx.fillStyle='rgba(0,0,0,0.12)';
  for(let y=0;y<H;y+=6){ctx.fillRect(0,y,W,3);}

  // border frame
  ctx.strokeStyle=t.accent;ctx.lineWidth=8;
  ctx.strokeRect(40,40,W-80,H-80);
  // double frame
  ctx.lineWidth=2;
  ctx.strokeRect(60,60,W-120,H-120);

  // helper: draw centered text
  function txt(text,y,color,size,letterSpacing){
    ctx.fillStyle=color;
    ctx.font='bold '+size+'px "Press Start 2P", monospace';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    if(letterSpacing){
      // manual letter spacing
      const chars=text.split('');
      const widths=chars.map(c=>ctx.measureText(c).width);
      const total=widths.reduce((a,b)=>a+b,0)+letterSpacing*(chars.length-1);
      let x=W/2-total/2;
      chars.forEach((c,i)=>{ctx.fillText(c,x+widths[i]/2,y);x+=widths[i]+letterSpacing;});
    } else {
      ctx.fillText(text,W/2,y);
    }
  }

  // ── HEADER ──
  txt('★ MY FAVOURITE ★',180,t.fg4,32,8);
  txt('POKÉMON',260,t.accent,68,6);

  // ── SUBTITLE ──
  const _gR=g=>(g===1?'I':g===2?'II':g===3?'III':g===4?'IV':'V');
  const sub=S.mode==='challenge'?(CHALLENGES[S.filterType]?CHALLENGES[S.filterType].title:'CHALLENGE'):
    (S.mode==='type'?'GEN '+_gR(useGen)+' · '+S.filterType.toUpperCase():'GEN '+_gR(useGen));
  txt(sub,360,t.fg,24,4);

  // ── SPRITE ──
  // load image and draw centered
  const img=new Image();
  img.crossOrigin='anonymous';
  await new Promise((resolve)=>{
    const sources=(SPRITE_SOURCES[useGen]||SPRITE_SOURCES[1]).map(fn=>fn(winner.id));
    let srcIdx=0;
    img.onload=resolve;
    img.onerror=()=>{ srcIdx++; if(srcIdx<sources.length){img.src=sources[srcIdx];}else{resolve();} };
    img.src=sources[0];
  });

  // sprite: large, centered
  const spriteSize=480;
  const sx=W/2-spriteSize/2;
  const sy=H/2-spriteSize/2-100;
  // sprite background panel
  ctx.fillStyle=t.bg2;
  ctx.fillRect(W/2-spriteSize/2-40,sy-40,spriteSize+80,spriteSize+80);
  ctx.strokeStyle=t.fg4;ctx.lineWidth=4;
  ctx.strokeRect(W/2-spriteSize/2-40,sy-40,spriteSize+80,spriteSize+80);
  if(img.complete && img.naturalWidth>0){
    ctx.drawImage(img,sx,sy,spriteSize,spriteSize);
  } else {
    ctx.fillStyle=t.fg4;ctx.font='bold 200px "Press Start 2P", monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('?',W/2,sy+spriteSize/2);
  }

  // ── POKEMON INFO ──
  const num='#'+String(winner.id).padStart(3,'0');
  txt(num,sy+spriteSize+100,t.fg4,28,4);
  txt(winner.name,sy+spriteSize+180,t.accent,72,4);
  txt(winner.types.join(' / ').toUpperCase(),sy+spriteSize+260,t.fg,22,4);

  // ── TEAM STRIP (if a team exists for this category) ──
  let teamRowBottomY = sy+spriteSize+340; // default: where the next content would start
  const cat=S.mode==='challenge'?'ch_'+S.filterType:(genPrefix()+(S.mode==='type'?'type_'+S.filterType:'overall'));
  const team=(S.teams||{})[cat];
  if(team && team.length>1){
    // Load all team sprites in parallel
    const teamImgs = await Promise.all(team.map(p => new Promise(resolve => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => resolve({img:im, p});
      im.onerror = () => resolve({img:null, p});
      im.src = sprite(p.id, p.gen||genFromId(p.id));
    })));
    // Layout: team label + row of 6 cells centered
    const labelY = sy+spriteSize+340;
    txt('★ YOUR TEAM ★', labelY, t.fg4, 22, 4);
    const cellSize = 130;
    const gap = 14;
    const totalWidth = teamImgs.length*cellSize + (teamImgs.length-1)*gap;
    const startX = W/2 - totalWidth/2;
    const rowY = labelY + 70;
    teamImgs.forEach((entry, i) => {
      const cx = startX + i*(cellSize+gap);
      const isAce = entry.p.id === winner.id;
      // cell background
      ctx.fillStyle = t.bg2;
      ctx.fillRect(cx, rowY, cellSize, cellSize);
      // cell border (thicker if ace)
      ctx.strokeStyle = isAce ? t.accent : t.fg4;
      ctx.lineWidth = isAce ? 6 : 2;
      ctx.strokeRect(cx, rowY, cellSize, cellSize);
      // sprite
      if(entry.img && entry.img.complete && entry.img.naturalWidth>0){
        const pad = 12;
        ctx.drawImage(entry.img, cx+pad, rowY+pad, cellSize-pad*2, cellSize-pad*2);
      }
    });
    teamRowBottomY = rowY + cellSize;
  }

  // ── FOOTER (URL) ──
  txt('YOUR FAVOURITE POKÉMON',H-160,t.fg,18,3);
  txt('POKEFAVOURITE.VERCEL.APP',H-110,t.fg4,14,2);

  // ── SHARE / DOWNLOAD ──
  const filename='my-favourite-'+winner.name.toLowerCase()+'.png';
  const isMobile=/Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(navigator.userAgent);
  canvas.toBlob(async (blob)=>{
    if(!blob){fallbackDownload();return;}
    const file=new File([blob],filename,{type:'image/png'});
    // only use Web Share API on actual mobile devices
    if(isMobile && navigator.canShare && navigator.canShare({files:[file]})){
      try {
        await navigator.share({
          files:[file],
          title:'My Favourite Pokémon',
          text:'I picked '+winner.name+' as my favourite — what is yours?'
        });
        return;
      } catch(e) {
        if(e.name!=='AbortError') fallbackDownload();
        return;
      }
    }
    // desktop: always download
    fallbackDownload();
    function fallbackDownload(){
      const link=document.createElement('a');
      link.download=filename;
      link.href=canvas.toDataURL('image/png');
      link.click();
    }
  },'image/png');
}

async function startChallenge(slug){
  if(S.busy) return;
  const ch=CHALLENGES[slug];
  if(!ch||!ch.available) return;
  S.busy=true;
  try {
    S.challenge=slug;
    // Resume saved session for big challenges (only registered users)
    if(ch.pool.length>BRACKET_THRESHOLD && S.user && !S.isGuest){
      const {data:rows} = await sb.from('pokemon_sessions')
        .select('*').eq('user_id',S.user.id).eq('mode','challenge').eq('filter_type',slug).limit(1);
      const existing = rows && rows.length>0 ? rows[0] : null;
      if(existing && existing.pool){
        const isBracket = typeof existing.pool==='object' && !Array.isArray(existing.pool) && existing.pool.__bracket;
        const hasMore = isBracket ? (existing.pool.__bracket.winners.length+ (existing.pool.__bracket.matches.length-existing.pool.__bracket.currentMatchIndex)*2 > 1) : false;
        if(hasMore){
          await resumeSession(existing);
          return;
        }
      }
    }
    await clearFavorite(categoryFor('challenge',slug));
    const pool=shuffle([...ch.pool]);
    if(pool.length>BRACKET_THRESHOLD){
      const bracket=buildBracket(pool);
      bracket.totalPicks=0;
      Object.assign(S,{mode:'challenge',filterType:slug,pool,
        round:0,total:bracketTotalMatches(pool.length),
        streak:0,maxStreak:0,winner:null,
        screen:'battle',currentView:'game',history:[],bracket});
    } else {
      Object.assign(S,{mode:'challenge',filterType:slug,pool,round:0,total:pool.length-1,
        streak:0,maxStreak:0,winner:null,screen:'battle',currentView:'game',history:[],bracket:null});
    }
    render();
  } finally {
    S.busy=false;
  }
}
