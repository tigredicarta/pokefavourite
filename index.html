async function exportUserData(){
  if(!S.user || S.isGuest) return;
  const btn=document.getElementById('export-btn');
  if(btn){btn.disabled=true;btn.textContent='▶ EXPORTING...';}
  try {
    const [profRes, favRes, sessRes] = await Promise.all([
      sb.from('profiles').select('*').eq('id',S.user.id).single(),
      sb.from('pokemon_favorites').select('*').eq('user_id',S.user.id),
      sb.from('pokemon_sessions').select('*').eq('user_id',S.user.id),
    ]);
    const data={
      exported_at: new Date().toISOString(),
      account: { id: S.user.id, email: S.user.email },
      profile: profRes.data || null,
      favorites: favRes.data || [],
      sessions: sessRes.data || [],
      service: 'YOUR FAVOURITE POKÉMON',
      service_version: 'v2.8',
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'my-pokemon-data-'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
    URL.revokeObjectURL(url);
  } catch(e){
    alert('Export failed: '+(e.message||e));
  } finally {
    if(btn){btn.disabled=false;btn.textContent='▶ EXPORT MY DATA';}
  }
}

async function deleteAccount(){
  if(!S.user || S.isGuest) return;
  const uid=S.user.id;
  const errors=[];
  try { await sb.from('pokemon_favorites').delete().eq('user_id',uid); } catch(e){ errors.push('favorites'); }
  try { await sb.from('pokemon_sessions').delete().eq('user_id',uid); } catch(e){ errors.push('sessions'); }
  try { await sb.from('pokemon_teams').delete().eq('user_id',uid); } catch(e){ errors.push('teams'); }
  try { await sb.from('profiles').delete().eq('id',uid); } catch(e){ errors.push('profile'); }
  try { await sb.auth.signOut(); } catch(e){}
  S.user=null;S.profile=null;S.favorites={};S.teams={};S.activeSessions=[];
  S.isGuest=false;S.guestLocalOnly=false;
  S.screen='landing';S.currentView='game';
  const msg=errors.length>0
    ?'SOME DATA COULD NOT BE DELETED ('+errors.join(', ')+') — PLEASE WRITE TO '+CONTACT_EMAIL+' TO COMPLETE DELETION.'
    :'YOUR DATA HAS BEEN ERASED. TO ALSO DELETE THE AUTHENTICATION RECORD, WRITE TO '+CONTACT_EMAIL+'.';
  showConfirm({title:'ACCOUNT DELETED',message:msg,confirmLabel:'OK',cancelLabel:'OK',onConfirm:()=>{}});
  render();
}

// Decorative glyphs not present in Press Start 2P (rendered via fallback font).
const ICON_GLYPHS='★▶◀▷▼▲⌂▦↻↶↺⚔◎♥✕≡◆→';
const ICON_RE=new RegExp('(['+ICON_GLYPHS+'])');
const ICON_TEST=new RegExp('['+ICON_GLYPHS+']');
// Wrap decorative glyphs in <span class="ico"> so CSS can re-centre them on the
// text line. Walks text nodes only — attributes and CSS are untouched.
function normalizeIcons(root){
  if(!root) return;
  const walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue || !ICON_TEST.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p=n.parentNode;
      if(p && p.nodeType===1 && p.classList.contains('ico')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes=[];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const frag=document.createDocumentFragment();
    n.nodeValue.split(ICON_RE).forEach(part=>{
      if(!part) return;
      if(ICON_TEST.test(part) && part.length===1){
        const s=document.createElement('span');
        s.className='ico'; s.textContent=part;
        frag.appendChild(s);
      } else {
        frag.appendChild(document.createTextNode(part));
      }
    });
    n.parentNode.replaceChild(frag, n);
  });
}

function undoLastPick(){
  if(!S.history||S.history.length===0||S.busy) return;
  const snap=S.history.pop();
  if(snap.bracket){
    // Bracket undo: restore full bracket snapshot
    S.bracket=snap.bracket;
  } else {
    S.pool=snap.pool;
  }
  S.round=snap.round;
  S.streak=snap.streak;
  S.maxStreak=snap.maxStreak;
  S.winner=snap.winner;
  if(S.screen==='result') S.screen='battle';
  if(S.mode!=='challenge'&&!S.isGuest) saveSession();
  render();
}

async function restartGame(){
  const confirmed=await new Promise(resolve=>showConfirm({
    title:'RESTART?',
    message:'RESTART FROM SCRATCH? CURRENT PROGRESS WILL BE LOST.',
    confirmLabel:'RESTART',
    cancelLabel:'CANCEL',
    onConfirm:()=>resolve(true),
    onCancel:()=>resolve(false),
  }));
  if(!confirmed) return;
  if(S.mode!=='challenge'){
    await deleteSession();
    S.activeSessions=S.activeSessions.filter(s=>!(s.gen===S.gen&&s.mode===S.mode&&(s.filter_type||'__none__')===(S.filterType||'__none__')));
  }
  let pool;
  if(S.mode==='challenge'){
    const ch=CHALLENGES[S.filterType];
    pool=shuffle([...(ch?ch.pool:[])]);
  } else {
    const pkm=currentPKM();
    const ft=S.filterType;
    pool=ft?shuffle(pkm.filter(p=>p.types.includes(ft))):shuffle([...pkm]);
  }
  if(useBracketFor(pool.length,S.mode)){
    const bracket=buildBracket(pool);
    bracket.totalPicks=0;
    Object.assign(S,{pool,round:0,total:bracketTotalMatches(pool.length),streak:0,maxStreak:0,winner:null,screen:'battle',history:[],bracket});
  } else {
    Object.assign(S,{pool,round:0,total:pool.length-1,streak:0,maxStreak:0,winner:null,screen:'battle',history:[],bracket:null});
  }
  render();
}

function goHome(){
  S.currentView='game';
  if(S.section==='challenges' || S.mode==='challenge'){
    S.section='challenges';
    S.screen='challenges_menu';
    document.body.className='challenges';
  } else {
    S.section='generations';
    S.screen='menu';
    document.body.className=S.gen===1?'gen1':S.gen===2?'gen2':S.gen===3?'gen3':S.gen===4?'gen4':'gen5';
  }
  S.mode=null;
  S.filterType=null;
  S.pool=[];
  S.history=[];
  S.bracket=null;S.team=null;S.teamPhase=false;
  updateLogoSubtitle();
  if(S.user && !S.isGuest) loadActiveSessions(S.user.id).then(s=>{S.activeSessions=s;render();});
  render();
}

function goLanding(){
  // Landing is only the public entry page. Logged-in users always go to the real app HOME.
  if(S.user){goHome();return;}
  S.currentView='game';
  S.screen='landing';
  document.body.className=S.section==='challenges'?'challenges':(S.gen===1?'gen1':S.gen===2?'gen2':'gen3');
  updateLogoSubtitle();
  render();
}

function goAppHome(){
  goHome();
}

function leaderboardBack(){
  goHome();
}

function exitBattle(){
  goHome();
}

function confirmAbandon(sess){
  if(confirm('Abandon this challenge? Progress will be lost.')){
    S.mode=sess.mode; S.filterType=sess.filter_type==='__none__'?null:sess.filter_type; S.gen=sess.gen;
    abandonSession();
  }
}

// ── INIT ──
async function init(){
  try {
    const {data,error}=await sb.auth.getSession();
    const session=data?.session;
    if(session?.user){
      S.user=session.user;
      S.isGuest=!!(S.user.is_anonymous||!S.user.email);
      if(S.isGuest){
        S.profile=null; S.favorites=loadGuestPicks(); S.teams=loadGuestTeams(); S.activeSessions=[];
      } else {
        try {
          [S.profile,S.favorites,S.teams,S.activeSessions]=await Promise.all([
            loadProfile(S.user.id),loadFavs(S.user.id),loadTeams(S.user.id),loadActiveSessions(S.user.id)
          ]);
        } catch(e){ console.warn('init: failed to load user data, continuing offline:', e); }
      }
      S.screen='menu';S.currentView='game';
    } else {S.screen='landing';}
  } catch(e){
    // Supabase unreachable: show landing cleanly. The "PLAY AS GUEST" button
    // (continueAsGuest) handles its own offline fallback to local guest mode.
    console.warn('init: Supabase unreachable, showing landing:', e);
    S.screen='landing';
  }
  render();
  sb.auth.onAuthStateChange(async(ev,sess)=>{
    if(ev==='SIGNED_IN'&&sess?.user){
      S.user=sess.user;
      S.isGuest=!!(S.user.is_anonymous||!S.user.email);
      if(S.isGuest){S.profile=null;S.favorites=loadGuestPicks();S.teams=loadGuestTeams();S.activeSessions=[];S.screen='menu';S.currentView='game';render();return;}
      // save pending nickname if present (from registration)
      try{
        const nick=localStorage.getItem('pending_nick');
        if(nick){await upsertProfile(S.user.id,nick);localStorage.removeItem('pending_nick');}
      }catch(e){}
      [S.profile, S.favorites, S.teams, S.activeSessions] = await Promise.all([
        loadProfile(S.user.id),
        loadFavs(S.user.id),
        loadTeams(S.user.id),
        loadActiveSessions(S.user.id)
      ]);
      if(!S.profile || !S.profile.display_name){
        const autoNick = S.user.email.split('@')[0].toUpperCase();
        await upsertProfile(S.user.id, autoNick);
        S.profile = await loadProfile(S.user.id);
      }
      S.screen='menu';S.currentView='game';render();
    }
    if(ev==='SIGNED_OUT'){if(S.screen==='auth'&&S.guestAuthReturn){return;}S.user=null;S.profile=null;S.favorites={};S.teams={};S.isGuest=false;S.guestLocalOnly=false;S.guestAuthReturn=null;S.screen='landing';render();}
  });}

// Desktop keyboard controls during battle: ←/1 pick left, →/2 pick right, U undo.
document.addEventListener('keydown', (e)=>{
  if(S.screen!=='battle') return;
  const tag=(e.target&&e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea') return;
  if(e.key==='ArrowLeft'||e.key==='1'){ e.preventDefault(); choose(0); }
  else if(e.key==='ArrowRight'||e.key==='2'){ e.preventDefault(); choose(1); }
  else if(e.key==='u'||e.key==='U'){ e.preventDefault(); undoLastPick(); }
});

init();
</script>
</body>
