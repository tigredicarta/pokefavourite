<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOUR FAVOURITE POKÉMON</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

:root { --px: 'Press Start 2P', monospace; }

.gen1 {
  --bg0:#0a0f0a; --bg1:#0f1f0f; --bg2:#1a3a1a; --bg3:#306230;
  --fg4:#3d8c3d; --fg5:#8bac0f; --fg6:#9bbc0f; --accent:#c8ff00;
  --border:#1a3a1a; --scanline:rgba(0,0,0,0.09);
}
.gen2 {
  --bg0:#0d0b1a; --bg1:#13112a; --bg2:#1e1b3a; --bg3:#3a2d6e;
  --fg4:#6a5acd; --fg5:#c8a800; --fg6:#e8c800; --accent:#ffe040;
  --border:#1e1b3a; --scanline:rgba(100,80,200,0.06);
}
/* CHALLENGES theme — neutral blue/gold, distinct from gens */
.challenges {
  --bg0:#08101a; --bg1:#0c1830; --bg2:#15264a; --bg3:#2a4070;
  --fg4:#5570a0; --fg5:#c89030; --fg6:#e0b860; --accent:#ffd060;
  --border:#15264a; --scanline:rgba(80,120,200,0.05);
}
body.challenges::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
  background:
    radial-gradient(ellipse 70% 50% at 30% 30%, rgba(80,120,255,0.05) 0%, transparent 70%),
    radial-gradient(ellipse 50% 70% at 80% 80%, rgba(255,200,80,0.04) 0%, transparent 60%);
}

/* TOP NAV — primary section switcher */
.top-nav {
  background:var(--bg0); border-bottom:1px solid var(--border);
  padding:0 16px; display:flex; gap:0;
}
.top-nav-tab {
  flex:1; background:transparent; border:none; color:var(--fg4);
  font-family:var(--px); font-size:7px; padding:14px 0; cursor:pointer;
  letter-spacing:2px; text-align:center;
  border-bottom:2px solid transparent;
  -webkit-appearance:none; border-radius:0;
}
.top-nav-tab.active { color:var(--accent); border-bottom-color:var(--accent); }

/* CHALLENGES PAGE */
.challenges-wrap { flex:1; padding:24px 16px; }
.challenges-title { font-size:10px; color:var(--accent); letter-spacing:2px; line-height:2; margin-bottom:6px; }
.challenges-sub { font-size:6px; color:var(--fg4); line-height:2.2; margin-bottom:24px; }
.challenges-grid { display:flex; flex-direction:column; gap:10px; }
.challenge-card {
  background:var(--bg1); border:1px solid var(--border); padding:18px 16px;
  display:flex; flex-direction:column; gap:6px; cursor:pointer;
  position:relative; -webkit-appearance:none; border-radius:0;
  font-family:var(--px); color:var(--fg6); text-align:left;
  transition:background 0.1s, border-color 0.1s;
  min-height:130px; justify-content:space-between;
}
.challenge-card-body { display:flex; flex-direction:column; gap:6px; }
.challenge-card-footer { margin-top:10px; }
.challenge-card:active { background:var(--bg2); border-color:var(--fg5); }
.challenge-card.disabled { opacity:0.4; cursor:not-allowed; pointer-events:none; }
.challenge-card-eyebrow { font-size:6px; color:var(--fg4); letter-spacing:2px; }
.challenge-card-title { font-size:9px; color:var(--accent); letter-spacing:1px; }
.challenge-card-desc { font-size:6px; color:var(--fg4); line-height:2; margin-top:4px; }
.challenge-badge {
  position:absolute; top:14px; right:14px; font-size:4px; color:var(--bg3);
  border:1px solid var(--bg3); padding:3px 7px; letter-spacing:2px;
}
.challenge-badge.new { color:var(--accent); border-color:var(--accent); }
.challenge-badge.mega-badge {
  background:linear-gradient(135deg, #ffd060, #ff8030);
  color:#1a0f00; border:none; font-weight:bold;
  font-size:5px; padding:5px 10px;
  box-shadow:0 0 8px rgba(255,200,80,0.4);
}
.challenge-card.mega {
  background:linear-gradient(135deg, rgba(255,208,96,0.08), rgba(255,128,48,0.08));
  border:2px solid #ffd060;
}
.challenge-card.mega .challenge-card-title { color:#ffd060; font-size:11px; }
.challenge-card.mega .challenge-card-eyebrow { color:#e0b860; }
@media (min-width:700px){
  .challenge-card.mega { grid-column: 1 / -1; }
  .challenge-card.mega .challenge-card-title { font-size:14px; }
}

/* gen badge under sprite in challenge battle */
.poke-gen-badge {
  font-size:5px; color:var(--fg4); border:1px solid var(--bg3);
  padding:3px 8px; letter-spacing:2px; margin-top:4px;
}

/* GEN 3 — Game Boy Advance: deep red/crimson */
.gen3 {
  --bg0:#0f0a08; --bg1:#1f1008; --bg2:#3a1a08; --bg3:#7a2a08;
  --fg4:#c05020; --fg5:#e87828; --fg6:#f09038; --accent:#ff4800;
  --border:#3a1a08; --scanline:rgba(200,80,0,0.07);
}
body.gen3::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
  background:
    radial-gradient(ellipse 70% 50% at 30% 30%, rgba(200,60,0,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 50% 70% at 80% 80%, rgba(255,80,0,0.04) 0%, transparent 60%);
}

/* GEN 4 — Nintendo DS Diamond/Pearl: glacial steel-blue */
.gen4 {
  --bg0:#080c12; --bg1:#0e1422; --bg2:#1a2540; --bg3:#3a4d75;
  --fg4:#5a78a8; --fg5:#8ca8d4; --fg6:#c0d4ec; --accent:#7cc8ff;
  --border:#1a2540; --scanline:rgba(120,180,240,0.06);
}
body.gen4::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
  background:
    radial-gradient(ellipse 70% 50% at 30% 30%, rgba(120,180,255,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 50% 70% at 80% 80%, rgba(180,200,230,0.04) 0%, transparent 60%);
}

html, body {
  min-height:100vh; min-height:100svh; min-height:100dvh;
  background:var(--bg0); color:var(--fg6);
  font-family:var(--px); overflow-x:hidden;
  transition:background 0.3s, color 0.3s;
  -webkit-text-size-adjust:100%;
}

body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:1000;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,var(--scanline) 3px,var(--scanline) 4px);
}
body.gen2::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:999;
  background:
    radial-gradient(ellipse 80% 60% at 20% 40%, rgba(100,60,200,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 60% 80% at 80% 70%, rgba(200,168,0,0.05) 0%, transparent 60%);
}

@keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
@keyframes flashwin { 0%,100%{background:var(--bg2)} 50%{background:var(--bg1)} }

/* ── GEN SWITCHER ── */
.gen-switcher {
  background:var(--bg1); border-bottom:1px solid var(--border);
  padding:8px 16px; display:flex; align-items:center; gap:4px;
}
.gen-switcher-label { display:none; }
.gen-tab {
  flex:1; background:transparent; border:1px solid var(--bg3); color:var(--fg4);
  font-family:var(--px); font-size:6px; padding:8px 0; cursor:pointer;
  letter-spacing:1px; text-align:center; transition:all 0.15s;
}
.gen-tab.active { background:var(--bg3); border-color:var(--accent); color:var(--accent); }

/* ── SITE HEADER ── */
.site-header {
  border-bottom:1px solid var(--border); padding:12px 16px;
  display:flex; align-items:center; justify-content:space-between;
  background:var(--bg1); position:sticky; top:0; z-index:100;
  gap:12px;
}
.logo { font-size:7px; color:var(--accent); letter-spacing:1px; line-height:1.6;
  white-space:nowrap; flex-shrink:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.logo span { display:none; font-size:6px; color:var(--fg4); letter-spacing:1px; }
.header-right { display:flex; align-items:center; gap:8px; flex-shrink:0; position:relative; }

/* user trigger button */
.user-trigger {
  display:flex; align-items:center; gap:6px;
  background:transparent; border:1px solid var(--bg3); color:var(--fg5);
  font-family:var(--px); font-size:6px; padding:7px 10px; cursor:pointer;
  letter-spacing:1px; -webkit-appearance:none; border-radius:0;
}
.user-trigger:active, .user-trigger.open { border-color:var(--accent); color:var(--accent); }
.user-trigger-name { max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.user-trigger-caret { font-size:5px; color:var(--fg4); transition:transform 0.15s; }
.user-trigger.open .user-trigger-caret { transform:rotate(180deg); color:var(--accent); }

/* dropdown menu */
.user-menu {
  position:absolute; top:calc(100% + 6px); right:0; min-width:220px;
  background:var(--bg1); border:1px solid var(--border);
  z-index:200; padding:0;
  box-shadow:0 4px 0 rgba(0,0,0,0.4);
}
.user-menu-status {
  padding:14px 16px; border-bottom:1px solid var(--border);
  display:flex; flex-direction:column; gap:6px;
}
.user-menu-label { font-size:5px; color:var(--fg4); letter-spacing:2px; }
.user-menu-name { font-size:8px; color:var(--accent); letter-spacing:1px;
  word-break:break-all; line-height:1.5; }
.user-menu-meta { font-size:5px; color:var(--bg3); letter-spacing:1px; line-height:1.6; }
.user-menu-action {
  display:block; width:100%; text-align:left;
  background:transparent; border:none; border-bottom:1px solid var(--border);
  color:var(--fg5); font-family:var(--px); font-size:7px; padding:14px 16px;
  cursor:pointer; letter-spacing:1px;
  -webkit-appearance:none; border-radius:0;
}
.user-menu-action:last-child { border-bottom:none; }
.user-menu-action:active { background:var(--bg2); color:var(--accent); }
.user-menu-action.danger:active { color:#ff5050; }
.user-menu-action .menu-action-sub {
  display:block; font-size:5px; color:var(--bg3); letter-spacing:1px; margin-top:5px;
}

/* backdrop for closing */
.user-menu-backdrop {
  position:fixed; inset:0; z-index:150; background:transparent;
}

/* confirm dialog */
.confirm-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1000;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.confirm-box {
  background:var(--bg1); border:1px solid var(--accent);
  max-width:340px; width:100%; padding:24px 20px;
  display:flex; flex-direction:column; gap:14px;
}
.confirm-title { font-size:9px; color:var(--accent); letter-spacing:2px; line-height:1.6; }
.confirm-msg { font-size:7px; color:var(--fg5); line-height:2; letter-spacing:1px; }
.confirm-actions { display:flex; gap:10px; margin-top:8px; }
.confirm-btn {
  flex:1; background:transparent; border:1px solid var(--bg3); color:var(--fg5);
  font-family:var(--px); font-size:7px; padding:12px 10px; cursor:pointer;
  letter-spacing:1px; -webkit-appearance:none; border-radius:0;
}
.confirm-btn.primary { border-color:var(--accent); color:var(--accent); }
.confirm-btn:active { background:var(--bg2); }

/* ── LEGAL PAGES ── */
.legal-wrap {
  flex:1; display:flex; flex-direction:column; align-items:center;
  padding:32px 20px 80px;
  overflow-y:auto;
}
.legal-box {
  width:100%; max-width:720px;
  background:var(--bg1); border:1px solid var(--border);
  padding:28px 22px;
}
.legal-back {
  background:transparent; border:none; color:var(--fg4);
  font-family:var(--px); font-size:6px; padding:0; cursor:pointer;
  margin-bottom:18px; letter-spacing:1px;
}
.legal-title {
  font-size:11px; color:var(--accent); letter-spacing:2px;
  line-height:1.6; margin-bottom:8px;
}
.legal-sub {
  font-size:6px; color:var(--fg4); letter-spacing:2px;
  margin-bottom:24px;
}
.legal-h2 {
  font-size:9px; color:var(--accent); letter-spacing:2px;
  margin-top:24px; margin-bottom:10px;
  padding-top:18px; border-top:1px solid var(--border);
}
.legal-h2:first-of-type { padding-top:0; border-top:none; margin-top:0; }
.legal-p {
  font-size:7px; color:var(--fg5); line-height:2.2;
  margin-bottom:14px; letter-spacing:0.5px;
}
.legal-p strong { color:var(--fg6); }
.legal-p a { color:var(--accent); text-decoration:underline; }
.legal-list {
  font-size:7px; color:var(--fg5); line-height:2.2;
  margin-bottom:14px; padding-left:18px; letter-spacing:0.5px;
}
.legal-list li { margin-bottom:6px; }
.legal-meta {
  font-size:5px; color:var(--bg3); letter-spacing:2px;
  margin-top:32px; padding-top:16px; border-top:1px solid var(--border);
}
@media (min-width:700px){
  .legal-wrap { padding:48px 32px 96px; }
  .legal-box { padding:48px 56px; }
  .legal-title { font-size:18px; margin-bottom:14px; }
  .legal-sub { font-size:7px; margin-bottom:32px; }
  .legal-h2 { font-size:12px; margin-top:32px; padding-top:24px; }
  .legal-p, .legal-list { font-size:9px; line-height:2; }
  .legal-meta { font-size:6px; }
}

/* ── TERMS CHECKBOX (register form) ── */
.terms-row {
  display:flex; align-items:flex-start; gap:10px;
  padding:14px 0; margin-bottom:12px;
  font-size:7px; color:var(--fg4); line-height:1.8; letter-spacing:0.5px;
}
.terms-row input[type="checkbox"] {
  flex-shrink:0; width:16px; height:16px;
  margin-top:1px; cursor:pointer;
  accent-color:var(--accent);
}
.terms-row label { cursor:pointer; }
.terms-row a, .terms-link { color:var(--accent); text-decoration:underline; cursor:pointer; }

/* ── LANDING LEGAL FOOTER ── */
.landing-legal {
  padding:24px 20px 32px;
  display:flex; flex-direction:column; gap:10px;
  align-items:center; text-align:center;
  border-top:1px solid var(--border);
}
.landing-legal-links {
  display:flex; gap:16px; flex-wrap:wrap; justify-content:center;
}
.landing-legal-link {
  font-size:6px; color:var(--fg4); letter-spacing:2px;
  cursor:pointer; padding:4px 0;
  background:none; border:none; font-family:var(--px);
}
.landing-legal-link:active, .landing-legal-link:hover { color:var(--accent); }
.landing-legal-disclaimer {
  font-size:5px; color:var(--bg3); line-height:1.8;
  letter-spacing:1px; max-width:480px; margin-top:8px;
}
@media (min-width:700px){
  .landing-legal-link { font-size:7px; }
  .landing-legal-disclaimer { font-size:6px; }
}

/* ── ACCOUNT SETTINGS PAGE ── */
.account-section {
  border-top:1px solid var(--border);
  padding:18px 0; margin-top:18px;
}
.account-section:first-child { border-top:none; padding-top:0; margin-top:0; }
.account-h3 {
  font-size:8px; color:var(--accent); letter-spacing:2px;
  margin-bottom:12px;
}
.account-row {
  display:flex; flex-direction:column; gap:6px;
  padding:10px 0; font-size:7px; color:var(--fg5);
}
.account-row-label { font-size:5px; color:var(--bg3); letter-spacing:2px; }
.account-row-value { color:var(--fg6); word-break:break-all; }
.btn-danger {
  background:transparent; border:1px solid #6b2020; color:#c05050;
  font-family:var(--px); font-size:7px; padding:12px 16px; cursor:pointer;
  letter-spacing:1px; -webkit-appearance:none; border-radius:0;
  margin-top:8px;
}
.btn-danger:active { background:#6b2020; color:var(--fg6); }
@media (min-width:700px){
  .account-h3 { font-size:10px; }
  .account-row { font-size:8px; }
  .account-row-label { font-size:6px; }
  .btn-danger { font-size:8px; }
  .btn-danger:hover { background:#6b2020; color:var(--fg6); }
}

@media (max-width: 520px) {
  .site-header { padding:10px 12px; gap:8px; }
  .header-right { gap:4px; }
  .user-trigger { font-size:5px; padding:6px 8px; }
  .user-trigger-name { max-width:60px; }
  .user-menu { min-width:200px; right:-8px; }
  .user-menu-name { font-size:7px; }
  .user-menu-action { font-size:6px; padding:12px 14px; }
}
.nav-btn {
  background:transparent; border:none; color:var(--fg4); font-family:var(--px);
  font-size:5px; padding:7px 8px; cursor:pointer; letter-spacing:1px;
  border-bottom:2px solid transparent;
}
.nav-btn.active { color:var(--accent); border-bottom-color:var(--accent); }
.btn-sm {
  background:transparent; border:1px solid var(--bg3); color:var(--fg5);
  font-family:var(--px); font-size:5px; padding:7px 10px; cursor:pointer; letter-spacing:1px;
}

/* ── MAIN ── */
.main { min-height:calc(100svh - 95px); min-height:calc(100dvh - 95px); display:flex; flex-direction:column; }

/* LOADING */
.loading-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; font-size:7px; color:var(--fg4); letter-spacing:2px; }
.pixel-cursor { width:10px; height:16px; background:var(--accent); animation:blink 0.7s infinite; }

/* ── AUTH ── */
.auth-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
.auth-box { width:100%; max-width:340px; margin:0 auto; border:1px solid var(--border); background:var(--bg1); padding:24px 18px; }
.auth-title { font-size:9px; color:var(--accent); margin-bottom:8px; letter-spacing:2px; line-height:1.7; }
.auth-sub { font-size:7px; color:var(--fg4); margin-bottom:22px; line-height:1.8; }
.field-label { font-size:7px; color:var(--fg4); margin-bottom:8px; display:block; letter-spacing:1px; }
.field-input {
  width:100%; background:var(--bg0); border:1px solid var(--bg3); color:var(--fg6);
  font-family:var(--px); font-size:16px; line-height:1.35; padding:10px 12px; outline:none; margin-bottom:12px;
  -webkit-appearance:none; border-radius:0;
}
.field-input::placeholder { font-size:12px; }
.field-input:focus { border-color:var(--accent); }
.field-input::placeholder { color:var(--bg3); }
/* Prevent iOS Safari auto-zoom on form fields */
input, textarea, select { font-size:16px; }
.btn-primary {
  width:100%; background:var(--fg5); border:none; color:var(--bg0);
  font-family:var(--px); font-size:7px; padding:12px; cursor:pointer;
  letter-spacing:1px; margin-top:4px; -webkit-appearance:none; border-radius:0;
}
.btn-primary:active { background:var(--accent); }
.btn-primary.dark { background:var(--bg2); color:var(--fg5); }
.btn-primary.dark:active { background:var(--bg3); color:var(--accent); }
.auth-msg { font-size:7px; color:var(--fg4); min-height:18px; margin:10px 0; line-height:1.8; }
.auth-msg.error { color:#c05050; }
.auth-toggle { font-size:7px; color:var(--fg4); text-align:center; margin-top:18px; cursor:pointer; line-height:1.8; padding:10px; }
.guest-note { font-size:6px; color:var(--fg4); line-height:1.8; text-align:center; margin-top:14px; }
.guest-cta { margin-top:10px; }

/* ── MENU ── */
.menu-wrap { flex:1; display:flex; flex-direction:column; }
.menu-left { background:var(--bg1); padding:28px 16px 24px; border-bottom:1px solid var(--border); }
.menu-hero { font-size:10px; color:var(--accent); line-height:2.2; margin-bottom:6px; letter-spacing:1px; }
.menu-sub { font-size:7px; color:var(--fg4); line-height:2.0; margin-bottom:24px; }
.menu-btn {
  display:block; width:100%; background:transparent; border:1px solid var(--bg3);
  color:var(--fg6); font-family:var(--px); font-size:7px; padding:16px 14px;
  cursor:pointer; text-align:left; letter-spacing:1px; margin-bottom:8px;
  position:relative; -webkit-appearance:none; border-radius:0;
}
.menu-btn::after { content:'▶'; position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--bg3); }
.menu-btn:active { background:var(--bg2); border-color:var(--fg5); color:var(--accent); }
.menu-btn small { display:block; font-size:6px; color:var(--fg4); margin-top:8px; letter-spacing:1px; }
.menu-pick-preview {
  display:flex; align-items:center; gap:10px; margin-top:12px; padding-top:10px;
  border-top:1px solid var(--bg2); min-height:34px;
}
.menu-pick-preview .preview-sprite { width:34px; height:34px; image-rendering:pixelated; flex-shrink:0; }
.preview-copy { display:flex; flex-direction:column; gap:4px; min-width:0; }
/* Pick preview — compact pill */
.preview-name {
  font-size:7px; color:var(--accent); letter-spacing:1px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.type-pick-preview, .challenge-pick-preview {
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(0,0,0,0.25); border:1px solid var(--bg3);
  padding:5px 12px 5px 5px; max-width:100%;
}
.type-pick-preview.empty, .challenge-pick-preview.empty { display:none; }
.type-pick-preview .preview-sprite,
.challenge-pick-preview .preview-sprite {
  width:34px; height:34px; image-rendering:pixelated; flex-shrink:0;
}

  1: [
    id => 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-i/red-blue/transparent/'+id+'.png',

// PS-compatible name map for special cases
const PS_NAMES = {29:'nidoran-f',32:'nidoran-m',83:'farfetchd',122:'mr-mime',
  185:'sudowoodo',201:'unown',250:'ho-oh',351:'castform',386:'deoxys'};
function getPSName(id){
  if(PS_NAMES[id]) return PS_NAMES[id];
  const pkm = (id<=151?PKM1:id<=251?PKM2:id<=386?PKM3:PKM4).find(p=>p.id===id);
  if(!pkm) return 'missingno';
  return pkm.name.toLowerCase().replace(/[^a-z0-9]/g,'-');
}

function sprite(id, gen) {
  const sources = SPRITE_SOURCES[gen] || SPRITE_SOURCES[1];
  return sources[0](id);
}

// build onerror chain for fallback loading
function spriteWithFallback(id, gen, cls, extraStyle) {
  const sources = SPRITE_SOURCES[gen] || SPRITE_SOURCES[1];
  const s = extraStyle ? ' style="'+extraStyle+'"' : '';
  // encode fallback chain into data attributes
  const fallbacks = sources.slice(1).map(fn=>fn(id)).join('|');
  return '<img class="'+cls+'" src="'+sources[0](id)+'"'
    +' data-fallbacks="'+fallbacks+'"'
    +' onerror="spriteFallback(this)"'
    +s+'>';
}

function spriteFallback(img) {
  const fallbacks = (img.getAttribute('data-fallbacks')||'').split('|').filter(Boolean);
  if(fallbacks.length === 0) {
    // all sources failed — show pixel placeholder
    img.style.display = 'none';
    const ph = document.createElement('div');
    ph.className = img.className + ' sprite-ph';
    ph.textContent = '?';
    ph.style.cssText = 'display:flex;align-items:center;justify-content:center;font-family:var(--px);color:var(--bg3);font-size:10px;background:var(--bg2);width:'+img.width+'px;height:'+img.height+'px;';
    img.parentNode.insertBefore(ph, img);
    return;
  }
  img.setAttribute('data-fallbacks', fallbacks.slice(1).join('|'));
  img.src = fallbacks[0];
}

// for cross-gen challenges: use the pokémon's own origin gen for sprite
function spriteByOriginGen(p, cls, extraStyle){
  return spriteWithFallback(p.id, p.gen||S.gen, cls, extraStyle);
}

const TYPE_IDS = {normal:1,fighting:2,flying:3,poison:4,ground:5,rock:6,bug:7,ghost:8,steel:9,
  fire:10,water:11,grass:12,electric:13,psychic:14,ice:15,dragon:16,dark:17};
function typeIdNum(t){ return TYPE_IDS[t.toLowerCase()]||1; }

function typeIconUrl(type, genOverride){

  return 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/types/generation-iii/emerald/'+id+'.png';

function typeIconsHTML(types, sizeOverride, genOverride){

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// Compact pick preview — shown as a corner badge on card buttons
// Deduce gen from Pokémon ID (1-151 = gen1, 152-251 = gen2, 252-386 = gen3)
function genFromId(id){ return id<=151?1:id<=251?2:id<=386?3:4; }

function pickPreviewHTML(p, cls, label, originGen){
  if(!p||!p.id) return '<div class="'+cls+' empty"></div>';

  const useGen=originGen||p.gen||genFromId(p.id)||S.gen;

// ── SESSION PERSISTENCE
async function saveSession() {
  if(!S.user||S.isGuest) return;
  // Skip saving for small linear challenges, but keep mega-bracket challenges saved
  if(S.mode==='challenge' && !S.bracket) return;
  // For bracket mode: persist S.bracket inside pool field as a wrapper {__bracket:{...}}
  // For linear mode: persist S.pool as before
  let payload;
  if(S.bracket){
    payload={__bracket:S.bracket};
  } else if(S.pool.length>1){
    payload=S.pool;
  } else {
    return; // nothing to save
  }
  const ft=S.filterType||'__none__';
  const {error} = await sb.from('pokemon_sessions').upsert({
    user_id:S.user.id,
    gen:S.gen,
    mode:S.mode,
    filter_type:ft,
    pool:payload,
    round:S.round,
    total:S.total,
    streak:S.streak,
    max_streak:S.maxStreak,
    updated_at:new Date().toISOString()
  },{onConflict:'user_id,gen,mode,filter_type'});
  if(error) console.error('saveSession error:', error.message);
}

async function deleteSession() {
  if(!S.user||S.isGuest) return;
  const ft=S.filterType||'__none__';
  await sb.from('pokemon_sessions')
    .delete()
    .eq('user_id',S.user.id)
    .eq('gen',S.gen)
    .eq('mode',S.mode)
    .eq('filter_type',ft);
}

async function loadActiveSessions(uid) {
  const {data} = await sb.from('pokemon_sessions').select('*').eq('user_id',uid);
  return data||[];
}

async function resumeSession(sess) {
  S.gen=sess.gen;
  S.mode=sess.mode;
  S.filterType=sess.filter_type==='__none__'?null:sess.filter_type;
  // Detect bracket vs linear payload
  if(sess.pool && typeof sess.pool==='object' && !Array.isArray(sess.pool) && sess.pool.__bracket){
    S.bracket=sess.pool.__bracket;
    S.pool=sess.pool.__bracket.initialPool||[];
  } else {
    S.bracket=null;
    S.pool=sess.pool;
  }
  S.round=sess.round;
  S.total=sess.total;
  S.streak=sess.streak;
  S.maxStreak=sess.max_streak;
  S.winner=null;
  S.history=[];
  S.screen='battle';
  S.currentView='game';
  document.body.className=S.gen===1?'gen1':S.gen===2?'gen2':S.gen===3?'gen3':'gen4';
  updateLogoSubtitle();
  render();
}

async function abandonSession() {
  await deleteSession();
  S.activeSessions=await loadActiveSessions(S.user.id);
  S.screen='menu';S.currentView='game';
  S.pool=[];S.round=0;S.total=0;S.streak=0;S.maxStreak=0;S.winner=null;
  render();
}

async function loadPokemonLb(mode) {
  const prefix=genPrefix();
  const catPrefixed=mode==='overall'?prefix+'overall':prefix+'type_'+mode;
  // include legacy unprefixed for gen1 backwards compat
  const cats=[catPrefixed];
  if(S.gen===1) cats.push(mode==='overall'?'overall':'type_'+mode);
  const {data,error} = await sb.from('pokemon_favorites')
    .select('pokemon_id,pokemon_name,pokemon_types,category')
    .in('category',cats);
  if(error||!data) return [];
  const counts={};
  data.forEach(r=>{
    const k=r.pokemon_id;
    if(!counts[k]) counts[k]={id:r.pokemon_id,name:r.pokemon_name,types:r.pokemon_types||[],votes:0};
    counts[k].votes++;
  });
  return Object.values(counts).sort((a,b)=>b.votes-a.votes).slice(0,25);
}

async function forgotPassword(){
  const email=document.getElementById('auth-email')?.value.trim();
  const msg=document.getElementById('auth-msg');
  if(!email){
    if(msg){msg.textContent='▶ ENTER YOUR EMAIL ABOVE FIRST';msg.className='auth-msg error';}
    return;
  }
  if(msg){msg.textContent='▶ ...';msg.className='auth-msg';}
  try {
    const redirectTo = window.location.origin;
    const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo});
    if(error) throw error;
    if(msg){msg.innerHTML='▶ IF AN ACCOUNT EXISTS FOR THIS EMAIL,<br>A PASSWORD RESET LINK HAS BEEN SENT.<br><br>★ CHECK YOUR SPAM FOLDER TOO.';msg.className='auth-msg';}
  } catch(e){
    if(msg){
      let em=(e.message||'').toUpperCase();
      if(em.includes('RATE LIMIT')||em.includes('TOO MANY')||em.includes('429')){
        msg.innerHTML='▶ TOO MANY REQUESTS.<br>PLEASE WAIT A FEW MINUTES.';
      } else {
        msg.textContent='▶ '+(em||'ERROR');
      }
      msg.className='auth-msg error';
    }
  }
}

async function doAuth() {
  const isReg=S.authMode==='register';
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-pass').value;
  const nick=isReg?document.getElementById('auth-nick').value.trim():null;
  const msg=document.getElementById('auth-msg');
  if(!email||!pass){msg.textContent='▶ ENTER EMAIL AND PASSWORD';msg.className='auth-msg error';return;}
  if(isReg&&!nick){msg.textContent='▶ ENTER A NICKNAME';msg.className='auth-msg error';return;}
  if(isReg){
    const termsBox=document.getElementById('auth-terms');
    if(!termsBox||!termsBox.checked){msg.textContent='▶ YOU MUST ACCEPT THE TERMS AND PRIVACY POLICY';msg.className='auth-msg error';return;}
  }
  msg.textContent='▶ ...';msg.className='auth-msg';S.busy=true;
  // Collect picks to migrate: from current guest session OR orphan localStorage picks
  let guestPicks=S.isGuest?{...(S.favorites||{})}:null;
  if(!guestPicks){
    const orphan=loadGuestPicks();
    if(orphan && Object.keys(orphan).length>0) guestPicks=orphan;
  }
  const wasGuest=S.isGuest;
  let error;
  try{
    if(isReg){
      if(wasGuest){try{await sb.auth.signOut();}catch(e){}}
      const r=await sb.auth.signUp({email,password:pass});
      error=r.error;
      if(!error){
        if(r.data.user){
          await upsertProfile(r.data.user.id,nick);
          if(guestPicks) await migrateGuestPicksToUser(r.data.user.id,guestPicks);
        }
        if(r.data.session&&r.data.user){
          S.user=r.data.user;S.isGuest=false;S.guestLocalOnly=false;
          S.profile=await loadProfile(S.user.id);S.favorites=await loadFavs(S.user.id);S.activeSessions=await loadActiveSessions(S.user.id);
          clearGuestPicks();S.screen='menu';S.currentView='game';S.guestAuthReturn=null;S.busy=false;render();return;
        }
        msg.innerHTML='▶ ACCOUNT CREATED!<br><br>CHECK YOUR INBOX FOR A CONFIRMATION EMAIL.<br>★ CHECK SPAM FOLDER TOO — FIRST EMAILS OFTEN LAND THERE.<br><br>CLICK THE LINK, THEN LOG IN.';msg.className='auth-msg';S.busy=false;return;
      }
    } else {
      const r=await sb.auth.signInWithPassword({email,password:pass});
      error=r.error;
      if(!error){S.user=r.data.user;S.isGuest=false;S.guestLocalOnly=false;if(guestPicks) await migrateGuestPicksToUser(S.user.id,guestPicks);}
    }
  }catch(e){error=e;}
  S.busy=false;
  if(error){
    if(wasGuest){S.user={id:'local-guest'};S.isGuest=true;S.favorites=guestPicks||loadGuestPicks();}
    let errMsg=(error.message||'').toUpperCase();
    if(errMsg.includes('RATE LIMIT')||errMsg.includes('TOO MANY')||errMsg.includes('429')){
      msg.innerHTML='▶ TOO MANY REQUESTS.<br>PLEASE WAIT A MOMENT BEFORE TRYING AGAIN.';
    } else if(errMsg.includes('NOT CONFIRMED')||errMsg.includes('CONFIRMATION')){
      msg.innerHTML='▶ EMAIL NOT CONFIRMED YET.<br><br>CHECK YOUR INBOX (AND SPAM FOLDER)<br>FOR THE CONFIRMATION LINK.';
    } else if(errMsg.includes('INVALID') && errMsg.includes('CREDENTIAL')){
      msg.textContent='▶ INVALID EMAIL OR PASSWORD';
    } else if(errMsg.includes('USER ALREADY')||errMsg.includes('ALREADY REGISTERED')){
      msg.textContent='▶ AN ACCOUNT WITH THIS EMAIL ALREADY EXISTS. TRY LOGGING IN.';
    } else if(errMsg.includes('PASSWORD') && errMsg.includes('SHORT')){
      msg.textContent='▶ PASSWORD TOO SHORT (MIN 6 CHARACTERS)';
    } else if(errMsg.includes('INVALID') && errMsg.includes('EMAIL')){
      msg.textContent='▶ INVALID EMAIL ADDRESS';
    } else {
      msg.textContent='▶ '+(errMsg||'ERROR');
    }
    msg.className='auth-msg error';return;
  }
  try{const nick=localStorage.getItem('pending_nick');if(nick){await upsertProfile(S.user.id,nick);localStorage.removeItem('pending_nick');}}catch(e){}
  S.profile=await loadProfile(S.user.id);S.favorites=await loadFavs(S.user.id);S.activeSessions=await loadActiveSessions(S.user.id);
  clearGuestPicks();S.screen='menu';S.currentView='game';S.guestAuthReturn=null;render();
}

// ── BRACKET TOURNAMENT ──
// Use bracket mode when pool > 10 (more than 10 Pokémon makes linear elimination tedious).
// Challenges always use linear (small pools).
const BRACKET_THRESHOLD = 10;
function useBracketFor(poolLen, mode){
  // Bracket activates for any pool >10 except small challenges (which stay linear).
  // The startChallenge function handles its own decision.
  return poolLen>BRACKET_THRESHOLD;
}

// Build initial bracket state from a shuffled pool
function buildBracket(pool){
  const totalRounds = Math.ceil(Math.log2(pool.length));
  const matches = [];
  // First round: pair Pokémon. Odd one gets a BYE (auto-advances).
  for(let i=0; i<pool.length; i+=2){
    if(i+1<pool.length){
      matches.push([pool[i], pool[i+1]]);
    }
    // odd one is added directly to winners (BYE)
  }
  const byeWinner = pool.length%2===1 ? [pool[pool.length-1]] : [];
  return {
    roundIndex: 0,
    totalRounds,
    currentMatchIndex: 0,
    matches,
    winners: byeWinner,           // winners advancing to next round
    survivors: [...byeWinner],    // all survivors of current round (so far)
    initialPool: pool.slice(),    // for restart
  };
}

// Get current pair for the battle UI
function bracketCurrentPair(b){
  if(!b||!b.matches) return null;
  return b.matches[b.currentMatchIndex] || null;
}

// Total picks in this bracket — sum of all matches across all rounds (excluding byes)
function bracketTotalMatches(initialSize){
  // each round halves with possible bye; total picks = initialSize - 1
  return initialSize - 1;
}

// How many picks done so far across all rounds
function bracketPicksDone(b){
  if(!b) return 0;
  // matches done in previous rounds + matches done in current round
  // we don't track previous — but: total picks done = (initial - currentSurvivorsAndWaiting)
  // simpler: track explicitly. Add a 'totalPicks' counter.
  return b.totalPicks||0;
}

// Round labels: SEMI, FINAL, etc. or ROUND N
function bracketRoundLabel(b){
  if(!b) return '';
  const remaining = b.totalRounds - b.roundIndex;
  if(remaining===1) return 'FINAL';
  if(remaining===2) return 'SEMIFINAL';
  if(remaining===3) return 'QUARTERFINAL';
  // For early rounds, show "ROUND N OF M"
  return 'ROUND '+(b.roundIndex+1)+'/'+b.totalRounds;
}

// Advance to next round (or finish)
function bracketAdvanceRound(b){
  // current matches all done; b.winners has all survivors of this round
  if(b.winners.length<=1) return; // end
  const survivors = b.winners.slice();
  const nextMatches = [];
  for(let i=0; i<survivors.length; i+=2){
    if(i+1<survivors.length){
      nextMatches.push([survivors[i], survivors[i+1]]);
    }
  }
  const byeWinner = survivors.length%2===1 ? [survivors[survivors.length-1]] : [];
  b.roundIndex++;
  b.matches = nextMatches;
  b.currentMatchIndex = 0;
  b.winners = byeWinner;
  b.survivors = [...byeWinner];
}

async function startGame(mode,ft){
  if(S.busy) return;
  S.busy=true;
  try {
  // check for saved session first — registered users only
  if(S.user&&!S.isGuest){
    const ft2=(ft||'__none__');
    const {data:rows} = await sb.from('pokemon_sessions')
      .select('*').eq('user_id',S.user.id).eq('gen',S.gen).eq('mode',mode).eq('filter_type',ft2).limit(1);
    const existing = rows && rows.length > 0 ? rows[0] : null;
    if(existing && existing.pool){
      const isBracket = typeof existing.pool==='object' && !Array.isArray(existing.pool) && existing.pool.__bracket;
      const hasMore = isBracket ? (existing.pool.__bracket.winners.length+ (existing.pool.__bracket.matches.length-existing.pool.__bracket.currentMatchIndex)*2 > 1) : existing.pool.length > 1;
      if(hasMore){
        await resumeSession(existing);
        return;
      }
    }
  }
  // no session — start fresh. Clear the previous champion for this run so the card becomes empty while replaying.
  const cat=categoryFor(mode,ft);
  await clearFavorite(cat);
  const pkm=currentPKM();
  const pool=ft?shuffle(pkm.filter(p=>p.types.includes(ft))):shuffle([...pkm]);
  if(pool.length===0){
    S.busy=false;
    alert('No Pokémon of this type in this generation.');
    return;
  }
  if(pool.length===1){
    // only one — auto-win
    Object.assign(S,{mode,filterType:ft||null,pool,round:0,total:0,streak:0,maxStreak:0,winner:pool[0],screen:'result',currentView:'game',history:[]});
    await autoSave(cat,pool[0]);
    render();
    return;
  }
  if(useBracketFor(pool.length,mode)){
    // BRACKET MODE
    const bracket=buildBracket(pool);
    bracket.totalPicks=0;
    Object.assign(S,{
      mode,filterType:ft||null,
      pool, // kept for backwards-compat with session restore
      round:0,total:bracketTotalMatches(pool.length),
      streak:0,maxStreak:0,winner:null,
      screen:'battle',currentView:'game',history:[],
      bracket,
    });
  } else {
    // LINEAR MODE
    Object.assign(S,{mode,filterType:ft||null,pool,round:0,total:pool.length-1,streak:0,maxStreak:0,winner:null,screen:'battle',currentView:'game',history:[],bracket:null});
  }
  render();
  } finally {
    S.busy=false;
  }
}

async function choose(idx){
  if(S.busy)return;S.busy=true;
  // BRACKET MODE
  if(S.bracket){
    return chooseBracket(idx);
  }
  // LINEAR MODE
  const chosen=S.pool[idx];
  S.history=[{pool:S.pool.slice(),round:S.round,streak:S.streak,maxStreak:S.maxStreak,winner:S.winner,clickedIdx:idx}];
  const cards=document.querySelectorAll('.pokemon-card');
  cards[idx].classList.add('winner');
  cards[1-idx].classList.add('loser');
  const footer=document.querySelector('.battle-footer-text');
  if(footer) footer.innerHTML='▶ '+chosen.name+' ADVANCES!<span class="battle-helper-text">NEXT MATCH LOADING…</span>';
  S.streak++;if(S.streak>S.maxStreak)S.maxStreak=S.streak;
  S.round++;
  const rest=S.pool.slice(2);
  const nextChallenger=rest.length>0?rest[0]:null;
  const remaining=rest.slice(1);
  if(nextChallenger){
    const newPool=[];
    newPool[idx]=chosen;
    newPool[1-idx]=nextChallenger;
    S.pool=[...newPool, ...remaining];
  } else {
    S.pool=[chosen];
  }
  if(S.mode!=='challenge'&&!S.isGuest) saveSession();
  if(S.round%10===0&&S.pool.length>1){
    const cat=S.mode==='challenge'?'ch_'+S.filterType:(genPrefix()+(S.mode==='type'?'type_'+S.filterType:'overall'));
    autoSave(cat,chosen);
  }
  await new Promise(r=>setTimeout(r,300));
  if(S.pool.length===1){
    S.winner=S.pool[0];
    const cat=S.mode==='challenge'?'ch_'+S.filterType:(genPrefix()+(S.mode==='type'?'type_'+S.filterType:'overall'));
    autoSave(cat,S.pool[0]);
    if(S.mode!=='challenge'&&!S.isGuest){
      deleteSession().then(()=>{
        S.activeSessions=S.activeSessions.filter(s=>!(s.gen===S.gen&&s.mode===S.mode&&(s.filter_type||'__none__')===(S.filterType||'__none__')));
      });
    }
    S.screen='result';
    S.busy=false;render();
    return;
  }
  async function chooseBracket(idx){
  const b=S.bracket;
  const pair=b.matches[b.currentMatchIndex];
  if(!pair) { S.busy=false; return; }
  const chosen=pair[idx];
  const loser=pair[1-idx];

  // save snapshot for undo
  S.history=[{
    bracket:JSON.parse(JSON.stringify(b)),
    round:S.round,streak:S.streak,maxStreak:S.maxStreak,winner:S.winner,clickedIdx:idx,
  }];

  // animate
  const cards=document.querySelectorAll('.pokemon-card');
  if(cards[idx]) cards[idx].classList.add('winner');
  if(cards[1-idx]) cards[1-idx].classList.add('loser');
  const footer=document.querySelector('.battle-footer-text');
  if(footer) footer.innerHTML='▶ '+chosen.name+' ADVANCES!<span class="battle-helper-text">NEXT MATCH LOADING…</span>';

  S.streak++;if(S.streak>S.maxStreak)S.maxStreak=S.streak;
  S.round++;
  b.totalPicks=(b.totalPicks||0)+1;
  b.winners.push(chosen);
  b.survivors.push(chosen);
  b.currentMatchIndex++;

  // periodic autosave
  if(S.round%10===0){
    const cat=S.mode==='challenge'?'ch_'+S.filterType:(genPrefix()+(S.mode==='type'?'type_'+S.filterType:'overall'));
    autoSave(cat,chosen);
  }
  if(!S.isGuest) saveSession();

  await new Promise(r=>setTimeout(r,300));

  // round complete?
  if(b.currentMatchIndex>=b.matches.length){
    // advance round
    if(b.winners.length===1){
      // CHAMPION!
      S.winner=b.winners[0];
      S.bracket=null;
      const cat=S.mode==='challenge'?'ch_'+S.filterType:(genPrefix()+(S.mode==='type'?'type_'+S.filterType:'overall'));
      autoSave(cat,S.winner);
      if(!S.isGuest){
        deleteSession().then(()=>{
          S.activeSessions=S.activeSessions.filter(s=>!(s.gen===S.gen&&s.mode===S.mode&&(s.filter_type||'__none__')===(S.filterType||'__none__')));
        });
      }
      S.screen='result';
      S.busy=false;render();
      return;
    }
    bracketAdvanceRound(b);
  }
  S.busy=false;
  render();
}

// surgical DOM update — only swap card content, no full re-render
  const g=S.gen;
  const p0=S.pool[0],p1=S.pool[1];
  const prog=S.total>0?(S.round/S.total*100):0;
  const pf=document.querySelector('.progress-fill');
  if(pf) pf.style.width=prog+'%';
  const bc=document.querySelector('.battle-count');
  if(bc) bc.textContent=S.round+' / '+S.total;
  const bs=document.querySelector('.battle-streak');
  if(bs) bs.textContent='STREAK: '+S.streak;
  function updateCard(card, p){
    const img=card.querySelector('.poke-sprite');
    const num=card.querySelector('.poke-num');
    const name=card.querySelector('.poke-name');
    const type=card.querySelector('.poke-type');
    const genBadge=card.querySelector('.poke-gen-badge');
    if(num) num.textContent='#'+String(p.id).padStart(3,'0');
    if(name) name.textContent=p.name;
    if(type) type.innerHTML=typeIconsHTML(p.types,18,S.mode==='challenge'&&p.gen?p.gen:null);
    if(genBadge) genBadge.textContent='GEN '+(p.gen===1?'I':p.gen===2?'II':'III');
    if(img){
      const useGen=S.mode==='challenge'&&p.gen?p.gen:g;
      img.src=sprite(p.id,useGen);
      img.setAttribute('data-fallbacks',(SPRITE_SOURCES[useGen]||SPRITE_SOURCES[1]).slice(1).map(fn=>fn(p.id)).join('|'));
      img.onerror=function(){spriteFallback(this);};
    }
    card.classList.remove('winner','loser');
  }
  if(cards[0]&&cards[1]){
    updateCard(cards[0],p0);
    updateCard(cards[1],p1);
    cards[0].onclick=()=>choose(0);
    cards[1].onclick=()=>choose(1);
  } else {
    render();
  }
  if(footer) footer.textContent='▶ CLICK YOUR FAVOURITE';
  // swap placeholder/floating undo button if needed
  const placeholder=document.querySelector('.battle-undo-placeholder');
  const floating=document.querySelector('.battle-undo-floating');
  if(S.history&&S.history.length>0&&placeholder&&!floating){
    const btn=document.createElement('button');
    btn.className='battle-undo-floating';
    btn.innerHTML='&#8630; UNDO LAST PICK';
    btn.onclick=undoLastPick;
    placeholder.replaceWith(btn);
  }
  S.busy=false;
}

// ── SHARE STORY (canvas 1080x1920) ──
async function shareStory(){
  const winner=S.winner;if(!winner) return;
  const useGen=S.mode==='challenge'&&winner.gen?winner.gen:S.gen;
  const W=1080,H=1920;
  const canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.imageSmoothingEnabled=false;

  // theme colors based on gen
  const themes={
    1:{bg:'#0a0f0a',bg2:'#1a3a1a',accent:'#c8ff00',fg:'#9bbc0f',fg4:'#3d8c3d'},
    2:{bg:'#0d0b1a',bg2:'#1e1b3a',accent:'#ffe040',fg:'#e8c800',fg4:'#6a5acd'},
    3:{bg:'#0f0a08',bg2:'#3a1a08',accent:'#ff4800',fg:'#f09038',fg4:'#c05020'},
    ch:{bg:'#08101a',bg2:'#15264a',accent:'#ffd060',fg:'#e0b860',fg4:'#5570a0'}
  };
  const t=S.mode==='challenge'?themes.ch:themes[useGen];

  // background
  ctx.fillStyle=t.bg;ctx.fillRect(0,0,W,H);

  // scanline overlay
  ctx.fillStyle='rgba(0,0,0,0.12)';
  for(let y=0;y<H;y+=6){ctx.fillRect(0,y,W,3);}

  // border frame
  ctx.strokeStyle=t.accent;ctx.lineWidth=8;
  ctx.strokeRect(40,40,W-80,H-80);
  // double frame
  ctx.lineWidth=2;
  ctx.strokeRect(60,60,W-120,H-120);

  // helper: draw centered text
  function txt(text,y,color,size,letterSpacing){
    ctx.fillStyle=color;
    ctx.font='bold '+size+'px "Press Start 2P", monospace';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    if(letterSpacing){
      // manual letter spacing
      const chars=text.split('');
      const widths=chars.map(c=>ctx.measureText(c).width);
      const total=widths.reduce((a,b)=>a+b,0)+letterSpacing*(chars.length-1);
      let x=W/2-total/2;
      chars.forEach((c,i)=>{ctx.fillText(c,x+widths[i]/2,y);x+=widths[i]+letterSpacing;});
    } else {
      ctx.fillText(text,W/2,y);
    }
  }

  // ── HEADER ──
  txt('★ MY FAVOURITE ★',180,t.fg4,32,8);
  txt('POKÉMON',260,t.accent,68,6);

  // ── SUBTITLE ──
  const sub=S.mode==='challenge'?(CHALLENGES[S.filterType]?CHALLENGES[S.filterType].title:'CHALLENGE'):
    (S.mode==='type'?'GEN '+(useGen===1?'I':useGen===2?'II':'III')+' · '+S.filterType.toUpperCase():'GEN '+(useGen===1?'I':useGen===2?'II':'III'));
  txt(sub,360,t.fg,24,4);

  // ── SPRITE ──
  // load image and draw centered
  const img=new Image();
  img.crossOrigin='anonymous';
  await new Promise((resolve)=>{
    img.onload=resolve;
    img.onerror=resolve; // continue even if fails
    img.src=sprite(winner.id,useGen);
  });

  // sprite: large, centered
  const spriteSize=480;
  const sx=W/2-spriteSize/2;
  const sy=H/2-spriteSize/2-100;
  // sprite background panel
  ctx.fillStyle=t.bg2;
  ctx.fillRect(W/2-spriteSize/2-40,sy-40,spriteSize+80,spriteSize+80);
  ctx.strokeStyle=t.fg4;ctx.lineWidth=4;
  ctx.strokeRect(W/2-spriteSize/2-40,sy-40,spriteSize+80,spriteSize+80);
  if(img.complete && img.naturalWidth>0){
    ctx.drawImage(img,sx,sy,spriteSize,spriteSize);
  } else {
    ctx.fillStyle=t.fg4;ctx.font='bold 200px "Press Start 2P", monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('?',W/2,sy+spriteSize/2);
  }

  // ── POKEMON INFO ──
  const num='#'+String(winner.id).padStart(3,'0');
  txt(num,sy+spriteSize+100,t.fg4,28,4);
  txt(winner.name,sy+spriteSize+180,t.accent,72,4);
  txt(winner.types.join(' / ').toUpperCase(),sy+spriteSize+260,t.fg,22,4);

  // ── FOOTER (URL) ──
  txt('YOUR FAVOURITE POKÉMON',H-160,t.fg,18,3);
  txt('TIGREDICARTA-POKE.STATIC.HF.SPACE',H-110,t.fg4,14,2);

  // ── SHARE / DOWNLOAD ──
  const filename='my-favourite-'+winner.name.toLowerCase()+'.png';
  const isMobile=/Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(navigator.userAgent);
  canvas.toBlob(async (blob)=>{
    if(!blob){fallbackDownload();return;}
    const file=new File([blob],filename,{type:'image/png'});
    // only use Web Share API on actual mobile devices
    if(isMobile && navigator.canShare && navigator.canShare({files:[file]})){
      try {
        await navigator.share({
          files:[file],
          title:'My Favourite Pokémon',
          text:'I picked '+winner.name+' as my favourite — what is yours?'
        });
        return;
      } catch(e) {
        if(e.name!=='AbortError') fallbackDownload();
        return;
      }
    }
    // desktop: always download
    fallbackDownload();
    function fallbackDownload(){
      const link=document.createElement('a');
      link.download=filename;
      link.href=canvas.toDataURL('image/png');
      link.click();
    }
  },'image/png');
}

async function startChallenge(slug){
  if(S.busy) return;
  const ch=CHALLENGES[slug];
  if(!ch||!ch.available) return;
  S.busy=true;
  try {
    S.challenge=slug;
    // Resume saved session for big challenges (only registered users)
    if(ch.pool.length>BRACKET_THRESHOLD && S.user && !S.isGuest){
      const {data:rows} = await sb.from('pokemon_sessions')
        .select('*').eq('user_id',S.user.id).eq('mode','challenge').eq('filter_type',slug).limit(1);
      const existing = rows && rows.length>0 ? rows[0] : null;
      if(existing && existing.pool){
        const isBracket = typeof existing.pool==='object' && !Array.isArray(existing.pool) && existing.pool.__bracket;
        const hasMore = isBracket ? (existing.pool.__bracket.winners.length+ (existing.pool.__bracket.matches.length-existing.pool.__bracket.currentMatchIndex)*2 > 1) : false;
        if(hasMore){
          await resumeSession(existing);
          return;
        }
      }
    }
    await clearFavorite(categoryFor('challenge',slug));
    const pool=shuffle([...ch.pool]);
    if(pool.length>BRACKET_THRESHOLD){
      const bracket=buildBracket(pool);
      bracket.totalPicks=0;
      Object.assign(S,{mode:'challenge',filterType:slug,pool,
        round:0,total:bracketTotalMatches(pool.length),
        streak:0,maxStreak:0,winner:null,
        screen:'battle',currentView:'game',history:[],bracket});
    } else {
      Object.assign(S,{mode:'challenge',filterType:slug,pool,round:0,total:pool.length-1,
        streak:0,maxStreak:0,winner:null,screen:'battle',currentView:'game',history:[],bracket:null});
    }
    render();
  } finally {
    S.busy=false;
  }
}

function goBackFromLegal(){
  // Restore previous screen if we have a stored prev state
  if(S.legalPrev){
    S.screen = S.legalPrev.screen || (S.user ? 'menu' : 'landing');
    S.currentView = S.legalPrev.currentView || 'game';
    if(S.legalPrev.section) S.section = S.legalPrev.section;
    S.legalPrev = null;
    render();
    return;
  }
  // Fallback
  if(S.user) {
    S.screen = 'menu';
    S.currentView = 'game';
  } else {
    S.screen = 'landing';
    S.currentView = 'game';
  }
  render();
}

function openLegalPage(page){
  S.userMenuOpen=false;
  S.legalPrev={screen:S.screen, currentView:S.currentView, section:S.section};
  S.screen=page;
  S.currentView='legal';
  render();
}

async function exportUserData(){
  if(!S.user || S.isGuest) return;
  try {
    const [profRes, favRes, sessRes] = await Promise.all([
      sb.from('profiles').select('*').eq('id',S.user.id).single(),
      sb.from('pokemon_favorites').select('*').eq('user_id',S.user.id),
      sb.from('pokemon_sessions').select('*').eq('user_id',S.user.id),
    ]);
    const data={
      exported_at: new Date().toISOString(),
      account: { id: S.user.id, email: S.user.email },
      profile: profRes.data || null,
      favorites: favRes.data || [],
      sessions: sessRes.data || [],
      service: 'YOUR FAVOURITE POKÉMON',
      service_version: 'v2.6',
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'my-pokemon-data-'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
    URL.revokeObjectURL(url);
  } catch(e){
    alert('Export failed: '+(e.message||e));
  }
}

function confirmDeleteAccount(){
  showConfirm({
    title:'DELETE ACCOUNT?',
    message:'THIS WILL PERMANENTLY DELETE YOUR PROFILE, ALL YOUR PICKS, AND ALL YOUR SESSIONS. THIS CANNOT BE UNDONE.',
    confirmLabel:'DELETE',
    cancelLabel:'CANCEL',
    onConfirm: ()=>deleteAccount(),
  });
}

async function deleteAccount(){
  if(!S.user || S.isGuest) return;
  try {
    const uid=S.user.id;
    await sb.from('pokemon_favorites').delete().eq('user_id',uid);
    await sb.from('pokemon_sessions').delete().eq('user_id',uid);
    await sb.from('profiles').delete().eq('id',uid);
    await sb.auth.signOut();
    S.user=null;S.profile=null;S.favorites={};S.activeSessions=[];
    S.isGuest=false;S.guestLocalOnly=false;
    S.screen='landing';S.currentView='game';
    showConfirm({
      title:'DELETED',
      message:'YOUR DATA HAS BEEN ERASED FROM OUR DATABASE. TO ALSO DELETE THE AUTHENTICATION RECORD, WRITE TO '+CONTACT_EMAIL+'.',
      confirmLabel:'OK',
      cancelLabel:'OK',
      onConfirm: ()=>{},
    });
    render();
  } catch(e){
    alert('Delete failed: '+(e.message||e));
  }
}

      +'<button class="battle-restart-btn" onclick="restartGame()">&#8635; RESTART RUN</button>'
      +'</div>'
      +(S.history&&S.history.length>0?'<button class="battle-undo-floating" onclick="undoLastPick()">&#8630; UNDO LAST PICK</button>':'<div class="battle-undo-placeholder"></div>')
      +'</div>';
    // attach sprite-loaded listener to remove .is-loading once loaded (fade-in)
    setTimeout(()=>{
      document.querySelectorAll('.pokemon-card.is-loading').forEach(card=>{
        const img=card.querySelector('.poke-sprite');
        if(!img) return;
        const reveal=()=>card.classList.remove('is-loading');
        if(img.complete && img.naturalWidth>0) reveal();
        else { img.addEventListener('load',reveal,{once:true}); img.addEventListener('error',reveal,{once:true}); }
      });
    },0);
    return;
  }

  if(S.screen==='result'){
    const p=S.winner;
    const ml=S.mode==='type'?'TYPE '+S.filterType.toUpperCase():'OVERALL';
    app.innerHTML=genSwitcherHTML()+'<div class="result-wrap">'
      +'<div class="result-left">'
      +'<div class="result-eyebrow">'+(S.mode==='challenge'?'★ CHAMPION · '+(CHALLENGES[S.filterType]?CHALLENGES[S.filterType].title:'CHALLENGE'):('★ CHAMPION GEN '+(g===1?'I':g===2?'II':g===3?'III':'IV')+' · '+ml))+'</div>'
      +(S.mode==='challenge'?spriteByOriginGen(p,'result-sprite',''):spriteWithFallback(p.id,g,'result-sprite',''))
      +'<div class="result-name">'+p.name+'</div>'
      +'<div class="result-num">#'+String(p.id).padStart(3,'0')+'</div>'
      +'<div class="result-badge">'+p.types.join(' / ')+'</div>'
      +'</div>'
      +'<div class="result-right">'
      +'<div class="result-actions">'
      +(S.isGuest?'<div class="guest-save-note">'+(S.guestLocalOnly?'★ Local guest mode: enable Anonymous Sign-ins in Supabase to save votes in the Pokémon leaderboard.':'★ Pick kept in your guest profile.<br>Use SAVE PICKS to attach it to your account.')+'</div>':'')
      +(function(){
        const isMobile=/Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(navigator.userAgent);
        const useShare=isMobile && navigator.canShare && navigator.canShare({files:[new File([],'x.png',{type:'image/png'})]});
        const svg=useShare?'<svg width="10" height="12" viewBox="0 0 10 12" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align:middle;margin-right:4px"><path d="M5 1L5 7M5 1L2.5 3.5M5 1L7.5 3.5M1 6V11H9V6" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>':'<svg width="10" height="12" viewBox="0 0 10 12" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align:middle;margin-right:4px"><path d="M5 7L5 1M5 7L2.5 4.5M5 7L7.5 4.5M1 9V11H9V9" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>';
        const label=useShare?'SHARE STORY':'DOWNLOAD STORY';
        return '<button class="btn-primary" onclick="shareStory()" id="share-btn">'+svg+label+'</button>';
      })()
      +'<button class="btn-primary dark" onclick="openLeaderboard(\''+(S.mode==='challenge'?'challenge':'gen')+'\')">▦ VIEW LEADERBOARD</button>'
      +'<button class="btn-primary dark" onclick="'+(S.mode==='challenge'?'switchSection(\'challenges\')':'goHome()')+'">⌂ HOME</button>'
      +'<button class="btn-primary dark" onclick="'+(S.mode==='challenge'?'startChallenge(S.filterType)':'startGame(S.mode,S.filterType)')+'">↺ PLAY AGAIN</button>'
      +'</div></div></div>';
    return;
  }
}

// ── LEADERBOARD RENDER ──
function renderLeaderboard(app){
  const g=S.gen;
  const pkm=currentPKM();
  const relevantTypes=TYPES.filter(t=>pkm.some(p=>p.types.includes(t)));

  let viewTabsHtml='';

  let filterTabsHtml='';
  if(S.lbScope==='gen'){
    const tabs=[{key:'overall',label:'OVERALL'},...relevantTypes.map(t=>({key:t,label:t.toUpperCase()}))];
    filterTabsHtml='<div class="lb-filter-tabs">'+tabs.map(t=>'<button class="lb-tab '+(S.lbMode===t.key?'active':'')+'" onclick="switchLbTab(\''+t.key+'\')">'+t.label+'</button>').join('')+'</div>';
  } else if(S.lbScope==='challenge'){
    const availChs=Object.values(CHALLENGES).filter(c=>c.available);
    filterTabsHtml='<div class="lb-filter-tabs">'+availChs.map(c=>'<button class="lb-tab '+(S.lbChallenge===c.slug?'active':'')+'" onclick="switchLbChallenge(\''+c.slug+'\')">'+c.title+'</button>').join('')+'</div>';
  }

  let contentHtml='';

// for challenges: lookup pokemon's origin gen for sprite (cross-gen)
    // for pokemon: use S.gen
    const isCh=S.lbScope==='challenge';
    const findOriginGen=(id)=>{
      if(id<=151) return 1;
      if(id<=251) return 2;
      return 3;
    };
    if(!S.lbData){
      contentHtml='<div class="lb-loading">▶ LOADING...</div>';
    } else if(S.lbData.length===0){
      contentHtml='<div class="lb-empty">NO VOTES<br>FOR THIS '+(isCh?'CHALLENGE':'CATEGORY')+' YET.</div>';
    } else {
      const maxV=S.lbData[0].votes;
      const rows=S.lbData.map((p,i)=>{
        const isTop=i===0;
        const rankCls=isTop?'lb-rank top':'lb-rank';
        const barCls=isTop?'lb-bar-fill top':'lb-bar-fill';
        const pct=maxV>0?(p.votes/maxV*100):0;
        const spriteGen=isCh?findOriginGen(p.id):g;
        const genBadge=isCh?' · GEN '+(spriteGen===1?'I':spriteGen===2?'II':'III'):'';
        return '<tr>'
          +'<td class="'+rankCls+'">'+(i+1)+'</td>'
          +'<td>'+spriteWithFallback(p.id,spriteGen,'lb-sprite','')+'</td>'
          +'<td><div class="lb-pkm-name">'+p.name+'</div><div class="lb-pkm-num">#'+String(p.id).padStart(3,'0')+genBadge+'</div><div class="lb-pkm-type">'+((p.types||[]).join(' / '))+'</div></td>'
          +'<td class="lb-bar-cell"><div class="lb-bar-track"><div class="'+barCls+'" style="width:'+pct+'%"></div></div></td>'
          +'<td class="lb-votes">'+p.votes+' votes</td>'
          +'</tr>';
      }).join('');
      contentHtml='<div class="lb-table-wrap"><table class="lb-table">'
        +'<thead><tr><th>#</th><th></th><th>POKÉMON</th><th></th><th style="text-align:right">VOTES</th></tr></thead>'
        +'<tbody>'+rows+'</tbody></table></div>';
    }


  app.innerHTML=genSwitcherHTML()+'<div class="lb-wrap">'
    +'<button class="back-link" style="margin-bottom:20px" onclick="leaderboardBack()">◀ BACK</button>'
    +'<div class="lb-top"><div>'
    +'<div class="lb-title">'+(S.lbScope==='challenge'?'CHALLENGES<br>LEADERBOARD':'GEN '+(g===1?'I':g===2?'II':g===3?'III':'IV')+'<br>LEADERBOARD')+'</div>'
    +'<div class="lb-sub">'+(S.lbScope==='challenge'?'CROSS-GEN CHALLENGE · '+(CHALLENGES[S.lbChallenge]?CHALLENGES[S.lbChallenge].title:''):('GEN '+(g===1?'I — KANTO':g===2?'II — JOHTO':g===3?'III — HOENN':'IV — SINNOH')+' · MOST PICKED POKÉMON'))+'</div>'
    +'</div></div>'
    +viewTabsHtml
    +filterTabsHtml
    +contentHtml
    +'</div>';
}

function undoLastPick(){
  if(!S.history||S.history.length===0||S.busy) return;
  const snap=S.history.pop();
  if(snap.bracket){
    // Bracket undo: restore full bracket snapshot
    S.bracket=snap.bracket;
  } else {
    S.pool=snap.pool;
  }
  S.round=snap.round;
  S.streak=snap.streak;
  S.maxStreak=snap.maxStreak;
  S.winner=snap.winner;
  if(S.screen==='result') S.screen='battle';
  if(S.mode!=='challenge'&&!S.isGuest) saveSession();
  render();
}

async function restartGame(){
  if(!confirm('Restart from scratch? Current progress will be lost.')) return;
  if(S.mode!=='challenge'){
    await deleteSession();
    S.activeSessions=S.activeSessions.filter(s=>!(s.gen===S.gen&&s.mode===S.mode&&(s.filter_type||'__none__')===(S.filterType||'__none__')));
  }
  let pool;
  if(S.mode==='challenge'){
    const ch=CHALLENGES[S.filterType];
    pool=shuffle([...(ch?ch.pool:[])]);
  } else {
    const pkm=currentPKM();
    const ft=S.filterType;
    pool=ft?shuffle(pkm.filter(p=>p.types.includes(ft))):shuffle([...pkm]);
  }
  if(useBracketFor(pool.length,S.mode)){
    const bracket=buildBracket(pool);
    bracket.totalPicks=0;
    Object.assign(S,{pool,round:0,total:bracketTotalMatches(pool.length),streak:0,maxStreak:0,winner:null,screen:'battle',history:[],bracket});
  } else {
    Object.assign(S,{pool,round:0,total:pool.length-1,streak:0,maxStreak:0,winner:null,screen:'battle',history:[],bracket:null});
  }
  render();
}

function goHome(){
  S.currentView='game';
  if(S.section==='challenges' || S.mode==='challenge'){
    S.section='challenges';
    S.screen='challenges_menu';
    document.body.className='challenges';
  } else {
    S.section='generations';
    S.screen='menu';
    document.body.className=S.gen===1?'gen1':S.gen===2?'gen2':S.gen===3?'gen3':'gen4';
  }
  S.mode=null;
  S.filterType=null;
  S.pool=[];
  S.history=[];
  updateLogoSubtitle();
  if(S.user && !S.isGuest) loadActiveSessions(S.user.id).then(s=>{S.activeSessions=s;render();});
  render();
}

function goLanding(){
  // Landing is only the public entry page. Logged-in users always go to the real app HOME.
  if(S.user){goHome();return;}
  S.currentView='game';
  S.screen='landing';
  document.body.className=S.section==='challenges'?'challenges':(S.gen===1?'gen1':S.gen===2?'gen2':'gen3');
  updateLogoSubtitle();
  render();
}

function goAppHome(){
  goHome();
}

function leaderboardBack(){
  goHome();
}

function exitBattle(){
  goHome();
}

function confirmAbandon(sess){
  if(confirm('Abandon this challenge? Progress will be lost.')){
    S.mode=sess.mode; S.filterType=sess.filter_type==='__none__'?null:sess.filter_type; S.gen=sess.gen;
    abandonSession();
  }
}

// ── INIT ──
async function init(){
  // don't render loading flash — resolve session first, then render once
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user){
    S.user=session.user;
    S.isGuest=!!(S.user.is_anonymous||!S.user.email);
    if(S.isGuest){
      S.profile=null; S.favorites=loadGuestPicks(); S.activeSessions=[];
    } else {
      S.profile=await loadProfile(S.user.id);
      S.favorites=await loadFavs(S.user.id);
      S.activeSessions=await loadActiveSessions(S.user.id);
    }
    S.screen='menu';S.currentView='game';
  } else {S.screen='landing';}
  render();
  sb.auth.onAuthStateChange(async(ev,sess)=>{
    if(ev==='SIGNED_IN'&&sess?.user){
      S.user=sess.user;
      S.isGuest=!!(S.user.is_anonymous||!S.user.email);
      if(S.isGuest){S.profile=null;S.favorites=loadGuestPicks();S.activeSessions=[];S.screen='menu';S.currentView='game';render();return;}
      // save pending nickname if present (from registration)
      try{
        const nick=localStorage.getItem('pending_nick');
        if(nick){await upsertProfile(S.user.id,nick);localStorage.removeItem('pending_nick');}
      }catch(e){}
      [S.profile, S.favorites, S.activeSessions] = await Promise.all([
        loadProfile(S.user.id),
        loadFavs(S.user.id),
        loadActiveSessions(S.user.id)
      ]);
      if(!S.profile || !S.profile.display_name){
        const autoNick = S.user.email.split('@')[0].toUpperCase();
        await upsertProfile(S.user.id, autoNick);
        S.profile = await loadProfile(S.user.id);
      }
      S.screen='menu';S.currentView='game';render();
    }
    if(ev==='SIGNED_OUT'){if(S.screen==='auth'&&S.guestAuthReturn){return;}S.user=null;S.profile=null;S.favorites={};S.isGuest=false;S.guestLocalOnly=false;S.guestAuthReturn=null;S.screen='landing';render();}
  });}

init();
</script>
